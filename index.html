<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Sz@r – Pontszámláló</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#173226">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sz@r">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --felt:#173226;
    --felt-dark:#0d1e15;
    --felt-light:#20453450;
    --gold:#c8a35b;
    --gold-bright:#e6c986;
    --wine:#8f2c3c;
    --wine-bright:#b8465a;
    --cream:#efe6d3;
    --ink:#171210;
    --line: rgba(200,163,91,0.35);
    --danger:#b8465a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overscroll-behavior: none;}
  html{ background: var(--felt-dark); }
  body{
    background:
      radial-gradient(ellipse at top, #1d4632 0%, var(--felt) 45%, var(--felt-dark) 100%);
    min-height:100vh;
    font-family: sans-serif;
    color:var(--cream);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  input, textarea{
    -webkit-user-select: text;
    user-select: text;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    padding:18px 16px 40px;
    min-height:100vh;
  }
  /* ---------- Header ---------- */
  .brand{
    text-align:center;
    padding:10px 0 18px;
    position:relative;
  }
  .brand-emblem{
    width:54px;height:54px;margin:0 auto 6px;
    display:block;
  }
  .brand h1{
    font-family: cursive;
    font-size:34px;
    letter-spacing:4px;
    margin:0;
    color:var(--gold-bright);
    text-shadow:0 0 18px rgba(198,163,91,0.25);
  }
  .brand .sub{
    font-family: sans-serif;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    opacity:0.8;
    margin-top:2px;
  }
  .brand::after{
    content:"";
    display:block;
    width:80px;height:1px;
    background:var(--line);
    margin:14px auto 0;
  }
  /* ---------- Layout bits ---------- */
  .panel{
    background:linear-gradient(180deg, rgba(239,230,211,0.05), rgba(239,230,211,0.02));
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel-title{
    font-family: sans-serif;
    font-size:12px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .btn{
    display:block;
    width:100%;
    text-align:center;
    font-family: sans-serif;
    font-size:14px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    padding:13px 16px;
    border-radius:5px;
    border:1px solid transparent;
    cursor:pointer;
    margin-bottom:10px;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--ink);
  }
  .btn-ghost{
    background:transparent;
    color:var(--gold-bright);
    border-color:var(--line);
  }
  .btn-danger{
    background:transparent;
    color:var(--wine-bright);
    border-color:rgba(184,70,90,0.5);
  }
  .btn-small{
    display:inline-block;
    width:auto;
    padding:8px 14px;
    font-size:11px;
    margin:0;
  }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .btn{ margin-bottom:0; }
  .muted{ color:rgba(239,230,211,0.55); font-size:13px; }
  .empty-msg{
    text-align:center;
    padding:20px 10px;
    color:rgba(239,230,211,0.5);
    font-size:13px;
    line-height:1.6;
  }
  input[type=text], input[type=number]{
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:5px;
    padding:10px 12px;
    font-family: sans-serif;
    font-size:15px;
    width:100%;
  }
  input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  label.field-label{
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:6px;
  }
  /* ---------- Roster ---------- */
  .roster-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid rgba(200,163,91,0.15);
    font-family: monospace;
    font-size:13px;
  }
  .roster-row:last-child{ border-bottom:none; }
  .roster-name{
    font-family: sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--cream);
  }
  .roster-stats{
    display:flex;
    gap:14px;
    color:rgba(239,230,211,0.7);
    font-size:12px;
  }
  .roster-stats b{ color:var(--gold-bright); }
  .add-player-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .add-player-row input{ flex:1; }
  .icon-btn{
    background:transparent;
    border:1px solid rgba(184,70,90,0.4);
    color:var(--wine-bright);
    border-radius:5px;
    width:30px;height:30px;
    font-size:15px;
    cursor:pointer;
    line-height:1;
  }
  /* ---------- Player chips (new game selection) ---------- */
  .chip-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .chip{
    position:relative;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--cream);
    background:rgba(0,0,0,0.2);
  }
  .chip.selected{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--ink);
    border-color:transparent;
  }
  .chip .seat-badge{
    position:absolute;
    top:-7px; right:-7px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--wine);
    color:var(--cream);
    font-family: monospace;
    font-size:10px;
    display:flex;align-items:center;justify-content:center;
  }
  /* ---------- Passing indicator ---------- */
  .pass-card{
    text-align:center;
  }
  .pass-direction-label{
    font-family: sans-serif;
    font-size:18px;
    letter-spacing:1px;
    color:var(--gold-bright);
    font-weight:600;
    margin-bottom:2px;
  }
  .pass-round-label{
    font-size:11px;
    color:rgba(239,230,211,0.55);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .pass-strip{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px;
    margin-bottom:6px;
  }
  .pass-seat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    width:60px;
  }
  .pass-seat .paw{
    width:30px;height:30px;
    border-radius:50%;
    background:rgba(200,163,91,0.12);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
  }
  .pass-seat .nm{
    font-size:10.5px;
    text-align:center;
    color:var(--cream);
    line-height:1.2;
  }
  .pass-arrow-row{
    display:flex;
    justify-content:space-around;
    margin:-8px 0 10px;
  }
  .pass-arrow-row span{
    color:var(--wine-bright);
    font-size:16px;
  }
  .pass-cross-note{
    font-size:12px;
    color:var(--cream);
    margin-bottom:6px;
    line-height:1.7;
  }
  .seating-diagram-wrap{
    display:flex;
    justify-content:center;
    margin:6px 0 2px;
  }
  .cat-sleep{
    font-size:26px;
    margin-bottom:6px;
  }
  /* ---------- Score table ---------- */
  .score-grid{
    width:100%;
    border-collapse:collapse;
    font-family: monospace;
    font-size:13px;
  }
  .score-grid th, .score-grid td{
    padding:7px 4px;
    text-align:center;
    border-bottom:1px solid rgba(200,163,91,0.15);
  }
  .score-grid th{
    font-family: sans-serif;
    font-size:10.5px;
    letter-spacing:1px;
    color:var(--gold);
    text-transform:uppercase;
    font-weight:600;
  }
  .score-grid td.rnd{ color:rgba(239,230,211,0.5); }
  .score-grid tfoot td{
    font-weight:700;
    color:var(--gold-bright);
    border-top:1px solid var(--line);
    border-bottom:none;
  }
  .score-grid .moon-tag{
    color:var(--wine-bright);
    font-size:10px;
  }
  .total-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(200,163,91,0.15);
    align-items:center;
  }
  .total-row:last-child{ border:none; }
  .total-name{ font-weight:600; font-size:14.5px; }
  .total-val{ font-family: monospace; font-size:17px; color:var(--gold-bright); font-weight:700; }
  .remaining-danger{ color:var(--wine-bright); font-weight:700; }
  .leader-tag{
    font-size:10px;
    color:var(--felt-dark);
    background:var(--gold-bright);
    padding:1px 6px;
    border-radius:8px;
    margin-left:6px;
    font-family: sans-serif;
    letter-spacing:0.5px;
  }
  /* ---------- Round entry ---------- */
  .round-input-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:6px 0;
  }
  .round-input-row .rname{ flex:1; font-size:14px; font-weight:600; }
  .round-input-row input{ width:70px; text-align:center; }
  .moon-toggle{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid rgba(200,163,91,0.15);
    margin-bottom:8px;
    font-size:13px;
  }
  .moon-toggle input[type=checkbox]{ width:18px;height:18px; }
  .moon-select-wrap{ margin:8px 0 4px; }
  .sum-note{
    text-align:right;
    font-size:11.5px;
    color:rgba(239,230,211,0.55);
    margin:4px 0 10px;
  }
  .sum-note.warn{ color:var(--wine-bright); }
  /* ---------- History ---------- */
  .hist-card{
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .hist-card:active{ background:rgba(200,163,91,0.06); }
  .hist-top{ display:flex; justify-content:space-between; font-size:11px; color:rgba(239,230,211,0.5); margin-bottom:6px;}
  .hist-players{ font-size:13px; line-height:1.6; }
  .hist-players b{ color:var(--gold-bright); }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--gold);
    font-size:13px;
    margin-bottom:14px;
    cursor:pointer;
    font-family: sans-serif;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .target-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .target-row input{ width:90px; }
  .nav-tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .nav-tabs .tab{
    flex:1;
    text-align:center;
    padding:9px 6px;
    font-family: sans-serif;
    font-size:11.5px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    border:1px solid var(--line);
    border-radius:5px;
    color:rgba(239,230,211,0.6);
    cursor:pointer;
  }
  .nav-tabs .tab.active{
    color:var(--ink);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border-color:transparent;
    font-weight:700;
  }
  .toast{
    position:fixed;
    bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink);
    color:var(--cream);
    border:1px solid var(--gold);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    z-index:50;
    max-width:90%;
    text-align:center;
  }
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.65);
    display:flex; align-items:center; justify-content:center;
    z-index:60;
    padding:20px;
  }
  .modal-box{
    background:var(--felt-dark);
    border:1px solid var(--gold);
    border-radius:8px;
    padding:20px;
    max-width:360px;
    width:100%;
  }
  .modal-box h3{
    font-family: sans-serif;
    color:var(--gold-bright);
    font-size:16px;
    margin:0 0 10px;
    letter-spacing:0.5px;
  }
  .modal-box p{ font-size:13.5px; line-height:1.6; color:rgba(239,230,211,0.85); margin:0 0 16px;}

  /* ---------- Playable card game ---------- */
  .hand-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    padding:10px 0 6px;
  }
  .playcard{
    width:66px; height:94px;
    background:var(--cream);
    color:var(--ink);
    border-radius:6px;
    border:1px solid rgba(0,0,0,0.35);
    box-shadow:inset 0 0 0 3px var(--cream), inset 0 0 0 4px rgba(0,0,0,0.15);
    display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    padding:5px 4px;
    position:relative;
    cursor:pointer;
    user-select:none;
    transition:transform .1s ease, box-shadow .1s ease;
    flex-shrink:0;
  }
  .pc-pip-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1px;
    align-content:center;
    justify-content:center;
    width:100%;
  }
  .pc-pip-count-7 .pc-pip, .pc-pip-count-8 .pc-pip, .pc-pip-count-9 .pc-pip, .pc-pip-count-10 .pc-pip{
    width:12px; height:12px;
  }
  .pc-pip-grid path, .pc-pip-grid circle{ fill:currentColor; }
  .playcard.selected{
    transform:translateY(-10px);
    box-shadow:inset 0 0 0 3px var(--cream), inset 0 0 0 4px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.45);
    border-color:var(--gold);
  }
  .playcard.disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .pc-corner{
    align-self:flex-start;
    font-family: sans-serif;
    font-weight:700;
    font-size:13px;
    line-height:1;
  }
  .pc-corner-bottom{ align-self:flex-end; transform:rotate(180deg); }
  .pc-icon-svg{ width:32px; height:32px; }
  .pc-icon-svg path, .pc-icon-svg circle{ fill:currentColor; }
  .pc-figure-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
  }
  .pc-figure-svg{ width:28px; height:28px; }
  .pc-figure-svg path, .pc-figure-svg circle{ fill:currentColor; }
  .pc-icon-svg-small{ width:18px; height:18px; }
  .playcard.pc-piros{ color:var(--wine); }
  .playcard.pc-zöld{ color:#2f6b3f; }
  .playcard.pc-tök{ color:#a3791f; }
  .playcard.pc-makk{ color:#3a3028; }
  .playcard.received-card{
    box-shadow:inset 0 0 0 3px var(--cream), inset 0 0 0 4px rgba(0,0,0,0.15), 0 0 0 2px var(--gold-bright);
  }
  .received-tag{
    position:absolute;
    top:-8px; right:-6px;
    background:var(--gold-bright);
    color:var(--felt-dark);
    font-family: sans-serif;
    font-size:8px;
    font-weight:700;
    padding:1px 4px;
    border-radius:6px;
    letter-spacing:0.3px;
    z-index:2;
  }
  .received-mark{
    display:inline-block;
    background:var(--gold-bright);
    color:var(--felt-dark);
    font-size:9px;
    font-weight:700;
    padding:0px 5px;
    border-radius:6px;
  }

  .trick-row{
    display:flex;
    justify-content:space-around;
    align-items:flex-end;
    padding:14px 0 4px;
    min-height:100px;
  }
  .trick-slot{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .trick-slot .tname{
    font-size:10px;
    color:rgba(239,230,211,0.6);
    text-align:center;
    max-width:70px;
  }
  .trick-count-tag{
    font-size:9px;
    color:rgba(239,230,211,0.4);
    margin-bottom:2px;
  }
  .leader-mark{
    display:inline-block;
    font-size:9px;
    color:var(--felt-dark);
    background:var(--gold-bright);
    padding:0px 5px;
    border-radius:6px;
    font-family: sans-serif;
    letter-spacing:0.3px;
    margin-left:2px;
  }
  .trick-slot .empty-slot{
    width:66px; height:94px;
    border:1px dashed var(--line);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .acting-slot .empty-slot{
    border:1px solid var(--wine-bright);
    box-shadow:0 0 8px rgba(184,70,90,0.5);
  }
  .turn-dot{
    width:10px; height:10px;
    border-radius:50%;
    background:var(--wine-bright);
    animation:turnPulse 1.1s ease-in-out infinite;
  }
  @keyframes turnPulse{
    0%,100%{ opacity:0.4; transform:scale(0.85); }
    50%{ opacity:1; transform:scale(1.1); }
  }
  .turn-label{
    font-size:9.5px;
    color:var(--wine-bright);
    font-family: sans-serif;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .turn-label.muted-label{
    color:rgba(239,230,211,0.4);
  }
  .reveal-gate{ text-align:center; padding:26px 10px; }
  .reveal-gate .cat{ font-size:34px; margin-bottom:8px; }
</style>
</head>
<body>
<div id="app"><div class="empty-msg">Betöltés…</div></div>
<script>
(function(){
  "use strict";
  const STORAGE_KEY = "fekete_macska_state";
  const DIRECTIONS = ["right","left","across","hold"];
  const DIR_LABEL = {left:"Balra adsz", right:"Jobbra adsz", across:"Keresztbe adsz", hold:"Nem adsz lapot"};
  const DIR_SUB = {left:"pihenő kör helyett most passzoltok", right:"pihenő kör helyett most passzoltok", across:"a szemközti játékosnak adtok", hold:"ez a pihenő kör — mindenki megtartja a lapjait"};

  // ---------------- Firebase (többjátékos szoba) ----------------
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAnLOrYCtYUOKSmUhNTDDPfnsoIA5muhWc",
    authDomain: "szaar-kartyajatek.firebaseapp.com",
    projectId: "szaar-kartyajatek",
    storageBucket: "szaar-kartyajatek.firebasestorage.app",
    messagingSenderId: "291050323795",
    appId: "1:291050323795:web:175973d528409a10b4eba6"
  };
  let firestoreDb = null;
  function ensureFirebaseInit(){
    if(firestoreDb) return firestoreDb;
    try{
      if(typeof firebase === "undefined") return null;
      if(!firebase.apps || firebase.apps.length===0){
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      firestoreDb = firebase.firestore();
      return firestoreDb;
    }catch(e){ console.warn("Firebase init hiba", e); return null; }
  }
  function isFirebaseAvailable(){ return !!ensureFirebaseInit(); }
  function roomsCollection(){ return ensureFirebaseInit().collection("szar_rooms"); }
  function roomDocRef(code){ return roomsCollection().doc(code); }

  function getDeviceId(){
    try{
      let id = localStorage.getItem("szar-device-id");
      if(!id){ id = "dev-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem("szar-device-id", id); }
      return id;
    }catch(e){ return "dev-"+Math.random().toString(36).slice(2,10); }
  }
  function generateRoomCode(){ return String(Math.floor(1000 + Math.random()*9000)); }

  let state = { players: [], games: [], activeGameId: null, sessions: [], activeSessionId: null, myPlayerId: null };
  let ui = {
    screen: "dashboard",
    newPlayerName: "",
    onboardingName: "",
    selectedSeating: [],
    targetScore: 100,
    roundInputs: {},
    moonMode: false,
    moonPlayer: null,
    historyOpenId: null,
    sessionOpenId: null,
    newSessionName: "",
    modal: null,
    toast: null,
    playSetupHumans: [],
    playSeatOrder: [],
    playTargetScore: 100,

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state = Object.assign({players:[],games:[],activeGameId:null,sessions:[],activeSessionId:null,myPlayerId:null}, parsed);
      }
    }catch(e){
      // ha a böngésző nem engedi a tárolást, az app memóriában működik tovább
    }
    if(!state.myPlayerId || !state.players.some(p=>p.id===state.myPlayerId)){
      ui.screen = "onboarding";
    }
    render();
  }
  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      // csendben elnyeljük — ugyanígy viselkedik a Kódfejtő alkalmazás is
    }
  }

  function showToast(msg){
    ui.toast = msg;
    render();
    setTimeout(()=>{ ui.toast=null; render(); }, 2200);
  }

  function directionForRound(n){ return DIRECTIONS[(n-1)%4]; }

  function playerName(id){
    const p = state.players.find(p=>p.id===id);
    if(p) return p.name;
    for(const g of state.games){
      if(g.aiPlayers){
        const a = g.aiPlayers.find(a=>a.id===id);
        if(a) return a.name;
      }
      if(g.humanNames && g.humanNames[id]) return g.humanNames[id];
    }
    if(ui.online && ui.online.room && ui.online.room.game){
      const g = ui.online.room.game;
      if(g.aiPlayers){
        const a = g.aiPlayers.find(a=>a.id===id);
        if(a) return a.name;
      }
      if(g.humanNames && g.humanNames[id]) return g.humanNames[id];
    }
    if(ui.online && ui.online.room && ui.online.room.players){
      const p2 = ui.online.room.players.find(p=>p.deviceId===id);
      if(p2) return p2.name;
    }
    return "?";
  }

  // ---------------- Kártyajáték motor ----------------
  const SUITS = ["piros","zöld","tök","makk"];
  const RANKS = ["7","8","9","10","AL","FE","K","AS"];
  const RANK_LABEL = {"7":"7","8":"8","9":"9","10":"10","AL":"Alsó","FE":"Felső","K":"Király","AS":"Ász"};
  const RANK_SHORT = {"7":"7","8":"8","9":"9","10":"10","AL":"A","FE":"F","K":"K","AS":"Á"};
  const SUIT_LABEL = {piros:"Piros", "zöld":"Zöld", "tök":"Tök", makk:"Makk"};
  const DIFF_LABEL = {easy:"könnyű", medium:"közepes", hard:"nehéz", expert:"profi"};
  const SUIT_ICON = {
    piros: `<path d="M50 92 C16 66 2 42 2 23 C2 6 17 0 33 4 C43 8 48 15 50 21 C52 15 57 8 67 4 C83 0 98 6 98 23 C98 42 84 66 50 92 Z"/>`,
    "zöld": `<path d="M50 6 C58 6 60 12 56 17 C68 24 80 38 80 55 C80 74 66 88 50 97 C34 88 20 74 20 55 C20 38 32 24 44 17 C40 12 42 6 50 6 Z"/><path d="M50 24 L50 90" stroke="var(--felt-dark)" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    "tök": `<circle cx="50" cy="10" r="6"/><path d="M50 18 C30 18 20 36 20 56 L11 72 Q50 82 89 72 L80 56 C80 36 70 18 50 18 Z"/><circle cx="50" cy="80" r="7"/>`,
    makk: `<path d="M50 8 Q56 2 58 8 L58 14 Q50 12 42 14 L42 8 Q44 2 50 8 Z"/><path d="M26 40 Q26 16 50 16 Q74 16 74 40 Q74 50 62 50 L38 50 Q26 50 26 40 Z"/><path d="M36 50 Q30 74 50 94 Q70 74 64 50 Z"/>`
  };
  const FIGURE_ICON = {
    K: `<path d="M32 60 Q32 40 50 40 Q68 40 68 60 L73 76 L27 76 Z"/><circle cx="50" cy="27" r="12"/><path d="M31 15 L37 2 L44 12 L50 0 L56 12 L63 2 L69 15 Z"/><circle cx="50" cy="4" r="2.5"/>`,
    FE: `<path d="M32 62 Q32 42 50 42 Q68 42 68 62 L73 78 L27 78 Z"/><circle cx="50" cy="29" r="11"/><ellipse cx="50" cy="16" rx="17" ry="6"/><path d="M63 13 Q80 6 76 18 Q69 16 63 13 Z"/>`,
    AL: `<path d="M32 62 Q32 42 50 42 Q68 42 68 62 L73 78 L27 78 Z"/><circle cx="50" cy="29" r="11"/><path d="M36 18 Q50 5 64 18 Q64 24 50 24 Q36 24 36 18 Z"/>`
  };

  function rankIdx(r){ return RANKS.indexOf(r); }
  function isPenaltyCard(c){ return c.suit==="piros" || (c.suit==="zöld" && c.rank==="FE"); }
  function cardPoints(c){
    if(c.suit==="piros") return c.rank==="AS" ? 2 : 1;
    if(c.suit==="zöld" && c.rank==="FE") return 10;
    return 0;
  }

  function buildDeck(){
    const deck = [];
    SUITS.forEach(suit=> RANKS.forEach(rank=> deck.push({suit, rank, id: suit+"-"+rank})));
    return deck;
  }
  function shuffleDeck(deck){
    const d = deck.slice();
    for(let i=d.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [d[i],d[j]] = [d[j],d[i]];
    }
    return d;
  }
  function sortHand(cards){
    return cards.slice().sort((a,b)=>{
      const si = SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit);
      if(si!==0) return si;
      return rankIdx(a.rank) - rankIdx(b.rank);
    });
  }

  function isAI(g, id){ return !!(g.aiPlayers && g.aiPlayers.some(a=>a.id===id)); }
  function getAiDifficulty(g, id){
    const a = g.aiPlayers && g.aiPlayers.find(a=>a.id===id);
    return (a && a.difficulty) || "medium";
  }

  function reconcileSeatOrder(currentOrder, humanIds, aiCount){
    const aiIds = Array.from({length:aiCount}, (_,i)=>"ai-"+(i+1));
    const desired = new Set([...humanIds, ...aiIds]);
    let order = (currentOrder||[]).filter(id=>desired.has(id));
    const missingHumans = humanIds.filter(id=>!order.includes(id));
    if(missingHumans.length){
      let lastHumanIdx = -1;
      order.forEach((id,i)=>{ if(humanIds.includes(id)) lastHumanIdx = i; });
      order.splice(lastHumanIdx+1, 0, ...missingHumans);
    }
    const missingAi = aiIds.filter(id=>!order.includes(id));
    if(missingAi.length) order.push(...missingAi);
    return order;
  }

  function getPassRecipient(seating, direction, seatId){
    const i = seating.indexOf(seatId);
    if(direction==="left") return seating[(i+1)%4];
    if(direction==="right") return seating[(i+3)%4];
    if(direction==="across") return seating[(i+2)%4];
    return seatId;
  }

  function getLegalCards(hand, currentTrick){
    if(currentTrick.length===0){
      return hand.slice();
    }
    const ledSuit = currentTrick[0].card.suit;
    const sameSuit = hand.filter(c=>c.suit===ledSuit);
    return sameSuit.length>0 ? sameSuit : hand.slice();
  }

  function dangerScore(c){
    return (c.suit==="zöld"&&c.rank==="FE") ? 1000
      : (c.suit==="piros"&&c.rank==="AS") ? 900
      : c.suit==="piros" ? 500+rankIdx(c.rank)
      : rankIdx(c.rank);
  }

  function passDangerScore(c){
    // passzolásnál más a kockázat, mint dobásnál: az alacsony piros (7-9) elég biztonságos
    // MEGTARTANI (ritkán visz vele ütést), ezért nem érdemes feleslegesen továbbadni —
    // helyette bármelyik szín magas lapja (K/Ász) és a két garantált pontlap a valódi veszély.
    if(c.suit==="zöld" && c.rank==="FE") return 100;
    if(c.suit==="piros" && c.rank==="AS") return 95;
    const r = rankIdx(c.rank);
    if(c.suit==="piros"){
      if(r<=2) return 5+r; // 7,8,9 piros: biztonságos megtartani
      return 60+r; // 10, alsó, felső, király piros: veszélyesebb
    }
    return 20 + r*4; // más szín: minél magasabb, annál inkább csapda-veszély később
  }

  function unseenCards(ps, hand){
    // minden lap, amit még nem láttunk kijátszva, és nincs a saját kezünkben
    const seen = new Set(ps.playedCardIds||[]);
    hand.forEach(c=> seen.add(c.id));
    ps.currentTrick.forEach(e=> seen.add(e.card.id));
    return buildDeck().filter(c=>!seen.has(c.id));
  }

  function moonPotentialScore(hand){
    const bySuit = {};
    hand.forEach(c=>{ (bySuit[c.suit]=bySuit[c.suit]||[]).push(c); });
    let score = 0;
    SUITS.forEach(suit=>{
      const cards = (bySuit[suit]||[]).slice();
      let topStreak = 0;
      for(let i=RANKS.length-1; i>=0; i--){
        if(cards.some(c=>c.rank===RANKS[i])) topStreak++; else break;
      }
      score += topStreak;
      if(cards.length>=5) score += 2;
    });
    if(hand.some(c=>c.suit==="zöld"&&c.rank==="FE")) score += 2;
    if(hand.some(c=>c.suit==="piros"&&c.rank==="AS")) score += 1;
    return score;
  }

  function shouldAttemptMoon(hand){
    // csak akkor vállalja be, ha a kéz erőssége alapján komoly esély van rá — nem kockáztat feleslegesen
    return moonPotentialScore(hand) >= 9;
  }

  function aiChoosePass(hand, difficulty){
    if(difficulty==="easy"){
      // gyenge AI: nagyjából véletlenszerű, csak a legveszélyesebb lapot próbálja elengedni
      const sorted = hand.slice().sort((a,b)=>dangerScore(b)-dangerScore(a));
      const worst = sorted[0];
      const rest = hand.filter(c=>c.id!==worst.id);
      const second = rest[Math.floor(Math.random()*rest.length)];
      return [worst, second];
    }
    if(difficulty==="expert"){
      if(shouldAttemptMoon(hand)){
        // ha a kéz elég erős egy teljes level-viteléhez, nem adja ki a kontroll-lapjait —
        // inkább a leggyengébb, legkevésbé hasznos lapokat engedi el
        return hand.slice().sort((a,b)=>passDangerScore(a)-passDangerScore(b)).slice(0,2);
      }
      return hand.slice().sort((a,b)=>passDangerScore(b)-passDangerScore(a)).slice(0,2);
    }
    return hand.slice().sort((a,b)=>dangerScore(b)-dangerScore(a)).slice(0,2);
  }

  function aiChooseCard(g, seatId){
    const ps = g.playState;
    const hand = ps.hands[seatId];
    const legal = getLegalCards(hand, ps.currentTrick);
    const difficulty = getAiDifficulty(g, seatId);

    if(difficulty==="easy"){
      // gyenge AI: véletlenszerű lap a szabályos lapok közül, csak a durva hibákat kerüli
      const notCatastrophic = legal.filter(c=>!(c.suit==="zöld"&&c.rank==="FE"));
      const pool = notCatastrophic.length ? notCatastrophic : legal;
      return pool[Math.floor(Math.random()*pool.length)];
    }

    const goingForMoon = difficulty==="expert" && shouldAttemptMoon(hand);

    if(ps.currentTrick.length===0){
      // kezdés
      if(goingForMoon){
        // level viteléhez minden ütést meg kell nyerni: a legmagasabb biztos nyerő lapot hívja
        const unseen = unseenCards(ps, hand);
        const bySuit = {};
        legal.forEach(c=>{ (bySuit[c.suit]=bySuit[c.suit]||[]).push(c); });
        let bestCard = null;
        Object.keys(bySuit).forEach(suit=>{
          const top = bySuit[suit].reduce((a,b)=> rankIdx(b.rank)>rankIdx(a.rank) ? b : a);
          const higherUnseen = unseen.filter(c=>c.suit===suit && rankIdx(c.rank)>rankIdx(top.rank));
          if(higherUnseen.length===0){ // biztosan nyer ezzel a színnel
            if(!bestCard || rankIdx(top.rank)>rankIdx(bestCard.rank)) bestCard = top;
          }
        });
        if(bestCard) return bestCard;
        // ha nincs teljesen biztos nyerő, a legerősebb lapját hívja, hogy tartsa a kontrollt
        return legal.reduce((a,b)=> rankIdx(b.rank)>rankIdx(a.rank) ? b : a);
      }
      if(difficulty==="hard" || difficulty==="expert"){
        const bySuit = {};
        hand.forEach(c=>{ (bySuit[c.suit] = bySuit[c.suit]||[]).push(c); });
        // profi: mielőtt bármilyen színt kivezényelne egy magas lappal, ellenőrzi, hogy az adott
        // szín legveszélyesebb lapja (zöld felső) még kint van-e valakinél — ha igen, és a
        // kivezényelt lap azt is elvinné, akkor ez egy csapda lenne saját magának, ezért kihagyja
        const captureRisk = (card)=>{
          if(card.suit==="zöld" && card.rank!=="FE"){
            const felsoId = "zöld-FE";
            const heldByMe = hand.some(c=>c.id===felsoId);
            const alreadyPlayed = (ps.playedCardIds||[]).includes(felsoId);
            if(!heldByMe && !alreadyPlayed && rankIdx(card.rank) > rankIdx("FE")) return true;
          }
          return false;
        };
        if(difficulty==="expert"){
          // profi: ha a kezében a piros lapok aránya már túl magas, inkább egy MOST még
          // alacsony pirossal jön ki (amíg biztonságos), mint hogy később, amikor csak magas
          // pirosai maradnak, kényszerűen azokkal kelljen hívnia
          const pirosCards = (bySuit["piros"]||[]).slice().sort((a,b)=>rankIdx(a.rank)-rankIdx(b.rank));
          const nonPirosCount = hand.length - pirosCards.length;
          if(pirosCards.length>0 && pirosCards.length>=nonPirosCount){
            const lowestPiros = pirosCards[0];
            if(rankIdx(lowestPiros.rank)<=2){ // 7,8 vagy 9 — ezekkel ritkán visz ütést, nincs sürgős okuk kimenni
              return lowestPiros;
            }
          }
          // profi: nem csak a piros veszélyes — bármelyik "ártatlan" szín is sok pontot hozhat,
          // ha a végére csak egy magas lapja marad belőle, és a többiek épp abba kényszerülnek
          // pontot dobni. Ezért ha egy színből már csak 1-2 lapja van, és van köztük magas (K/Ász),
          // inkább most vezényli ki (a legalacsonyabbal), amíg még van esély, hogy más viszi el —
          // DE csak ha ez nem jelent elfogási kockázatot (pl. még kint lévő zöld felsőt).
          const riskySuits = Object.keys(bySuit).filter(s=> s!=="piros" && bySuit[s].length<=2 &&
            bySuit[s].some(c=> rankIdx(c.rank) >= rankIdx("K")));
          const safeRiskySuits = riskySuits.filter(s=>{
            const candidate = bySuit[s].reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
            return !captureRisk(candidate);
          });
          if(safeRiskySuits.length>0){
            const suit = safeRiskySuits.reduce((a,b)=> bySuit[b].length<bySuit[a].length ? b : a);
            return bySuit[suit].reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
          }
        }
        // ha van olyan szín, amiben tudottan üres valaki más, azt hívja, hogy kényszerítse a dobást
        const others = g.seating.filter(id=>id!==seatId);
        const suitVoidCount = {};
        SUITS.forEach(s=>{ suitVoidCount[s] = others.filter(id=> (ps.voidSuits[id]||[]).includes(s)).length; });
        let bestSuit = null, bestVoidCount = -1;
        Object.keys(bySuit).forEach(s=>{
          if(s==="piros") return; // piros hívását kerüli, ha lehet
          const candidate = bySuit[s].reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
          if(difficulty==="expert" && captureRisk(candidate)) return;
          if(suitVoidCount[s] > bestVoidCount){ bestVoidCount = suitVoidCount[s]; bestSuit = s; }
        });
        if(bestSuit && bestVoidCount>0){
          return bySuit[bestSuit].reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
        }
        if(difficulty==="expert"){
          // profi: ha nincs kihasználható ismert szín-üresség, inkább a saját legrövidebb
          // (nem piros) színéből hív, hogy minél előbb maga is kiüresedjen abból — így később
          // bármikor szabadon dobhat, ha azt a színt hívják — de csak ha ez nem elfogási kockázat
          const nonPenaltySuits = Object.keys(bySuit).filter(s=>{
            if(s==="piros") return false;
            const candidate = bySuit[s].reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
            return !captureRisk(candidate);
          });
          if(nonPenaltySuits.length>0){
            const shortest = nonPenaltySuits.reduce((a,b)=> bySuit[b].length<bySuit[a].length ? b : a);
            return bySuit[shortest].reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
          }
        }
      }
      const safe = legal.filter(c=>!isPenaltyCard(c));
      const pool = safe.length ? safe : legal;
      return pool.reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
    }

    const ledSuit = ps.currentTrick[0].card.suit;
    const followable = legal.filter(c=>c.suit===ledSuit);
    if(followable.length>0){
      if(goingForMoon){
        // mindent visz, amit tud — a legalacsonyabb, még nyerő lappal
        let bestRank = -1;
        ps.currentTrick.forEach(e=>{ if(e.card.suit===ledSuit) bestRank = Math.max(bestRank, rankIdx(e.card.rank)); });
        const winners = followable.filter(c=>rankIdx(c.rank)>bestRank);
        if(winners.length>0) return winners.reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
        // nem tud nyerni — a level-terv megbukott ennél az ütésnél, a legalacsonyabbal veszítsen kevesebbet
        return followable.reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
      }
      let bestRank = -1;
      ps.currentTrick.forEach(e=>{ if(e.card.suit===ledSuit) bestRank = Math.max(bestRank, rankIdx(e.card.rank)); });
      const safe = followable.filter(c=>rankIdx(c.rank)<bestRank);
      if(safe.length>0){
        if(difficulty==="expert"){
          // profi: a biztonságos lapok közül azt adja, ami a legkevésbé csökkenti a jövőbeli
          // kontrollját — vagyis a legmagasabbat, DE csak ha a kártyaszámlálás szerint úgyis
          // biztosan veszít vele szemben egy még náluk lévő magasabb lap; egyébként a
          // legalacsonyabb biztonságosat tartja meg a színben maradt lapokra
          const unseen = unseenCards(ps, hand).filter(c=>c.suit===ledSuit);
          const higherStillOut = unseen.some(c=>rankIdx(c.rank)>bestRank);
          if(higherStillOut){
            return safe.reduce((a,b)=> rankIdx(b.rank)>rankIdx(a.rank) ? b : a);
          }
          return safe.reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
        }
        return safe.reduce((a,b)=> rankIdx(b.rank)>rankIdx(a.rank) ? b : a);
      }
      if(difficulty==="expert"){
        // profi: ha úgyis kénytelen vinni, és több lapja is ugyanannyi pontot eredményezne
        // ebben az ütésben, a legmagasabbal jön ki — így az alacsonyabb lapja megmarad
        // tartaléknak egy későbbi, biztonságosabb dobáshoz
        const existingPoints = ps.currentTrick.reduce((sum,e)=> sum + cardPoints(e.card), 0);
        let best = null, bestTotalPoints = Infinity;
        followable.forEach(c=>{
          const totalPts = existingPoints + cardPoints(c);
          if(totalPts < bestTotalPoints || (totalPts===bestTotalPoints && (!best || rankIdx(c.rank)>rankIdx(best.rank)))){
            best = c; bestTotalPoints = totalPts;
          }
        });
        return best;
      }
      return followable.reduce((a,b)=> rankIdx(b.rank)<rankIdx(a.rank) ? b : a);
    }
    return legal.reduce((a,b)=> dangerScore(b)>dangerScore(a) ? b : a);
  }

  function getActingSeatId(g){
    const ps = g.playState;
    const leaderIdx = g.seating.indexOf(ps.trickLeaderSeatId);
    return g.seating[(leaderIdx + ps.currentTrick.length)%4];
  }

  function playCard(g, seatId, card){
    const ps = g.playState;
    ps.playedCardIds = ps.playedCardIds || [];
    ps.playedCardIds.push(card.id);
    if(ps.currentTrick.length>0){
      const ledSuit = ps.currentTrick[0].card.suit;
      if(card.suit!==ledSuit){
        ps.voidSuits[seatId] = ps.voidSuits[seatId] || [];
        if(!ps.voidSuits[seatId].includes(ledSuit)) ps.voidSuits[seatId].push(ledSuit);
      }
    }
    ps.hands[seatId] = ps.hands[seatId].filter(c=>c.id!==card.id);
    ps.currentTrick.push({seatId, card});
    if(ps.currentTrick.length===4){
      const ledSuit = ps.currentTrick[0].card.suit;
      let winner = ps.currentTrick[0];
      ps.currentTrick.forEach(entry=>{
        if(entry.card.suit===ledSuit && rankIdx(entry.card.rank) > rankIdx(winner.card.rank)) winner = entry;
      });
      let pts = 0;
      ps.currentTrick.forEach(entry=>{ pts += cardPoints(entry.card); });
      ps.collectedPoints[winner.seatId] = (ps.collectedPoints[winner.seatId]||0) + pts;
      ps.trickWinsCount = ps.trickWinsCount || {};
      ps.trickWinsCount[winner.seatId] = (ps.trickWinsCount[winner.seatId]||0) + 1;
      ps.wonCards = ps.wonCards || {};
      ps.wonCards[winner.seatId] = ps.wonCards[winner.seatId] || [];
      ps.wonCards[winner.seatId].push(...ps.currentTrick.map(e=>e.card));
      ps.lastTrick = { cards: ps.currentTrick.slice(), winnerId: winner.seatId, points: pts, trickNumber: ps.trickIndex+1 };
      ps.phase = "trickResult";
      ps.trickAcks = {};
    }
    saveState();
  }

  function processAiTurns(g){
    while(g.playState && g.playState.phase==="playing"){
      const actingId = getActingSeatId(g);
      if(isAI(g, actingId)){
        const card = aiChooseCard(g, actingId);
        playCard(g, actingId, card);
        if(g.playState.phase!=="playing") break;
      } else {
        break;
      }
    }
  }

  function executePass(g){
    const ps = g.playState;
    const incoming = {};
    g.seating.forEach(id=>{ incoming[id]=[]; });
    g.seating.forEach(seatId=>{
      const ids = ps.passSelections[seatId] || [];
      const cards = ids.map(cid=> ps.hands[seatId].find(c=>c.id===cid)).filter(Boolean);
      ps.hands[seatId] = ps.hands[seatId].filter(c=>!ids.includes(c.id));
      const recipient = getPassRecipient(g.seating, ps.direction, seatId);
      incoming[recipient].push(...cards);
    });
    const justReceived = {};
    g.seating.forEach(id=>{
      ps.hands[id] = sortHand([...ps.hands[id], ...incoming[id]]);
      justReceived[id] = incoming[id].map(c=>c.id);
    });
    ps.justReceived = justReceived;
    ps.phase = "playing";
    ps.passSelections = {};
    ps.passQueueHumans = [];
    saveState();
    processAiTurns(g);
  }

  function startNewPlayRound(g){
    const roundN = g.rounds.length + 1;
    const dir = directionForRound(roundN);
    const deck = shuffleDeck(buildDeck());
    const hands = {};
    g.seating.forEach((id,i)=>{ hands[id] = sortHand(deck.slice(i*8,(i+1)*8)); });
    const passSelections = {};
    if(dir!=="hold"){
      g.seating.forEach(id=>{
        if(isAI(g, id)) passSelections[id] = aiChoosePass(hands[id], getAiDifficulty(g, id)).map(c=>c.id);
      });
    }
    g.playState = {
      phase: dir==="hold" ? "playing" : "passing",
      direction: dir,
      roundN,
      hands,
      passSelections,
      passQueueHumans: dir==="hold" ? [] : g.seating.filter(id=> g.humanIds.includes(id)),
      trickIndex: 0,
      currentTrick: [],
      trickLeaderSeatId: g.seating[roundN%4],
      collectedPoints: Object.fromEntries(g.seating.map(id=>[id,0])),
      trickWinsCount: Object.fromEntries(g.seating.map(id=>[id,0])),
      wonCards: Object.fromEntries(g.seating.map(id=>[id,[]])),
      voidSuits: {},
      playedCardIds: [],
      justReceived: {},
      lastTrick: null
    };
    ui.playRevealedSeatId = null;
    ui.playSelectedCards = [];
    ui.showWonCards = false;
    if(dir==="hold"){
      processAiTurns(g);
    } else if(g.playState.passQueueHumans.length===0){
      executePass(g);
    }
    saveState();
  }

  function commitRound(g, scores, moonShooter){
    const roundN = g.rounds.length + 1;
    const dir = directionForRound(roundN);
    g.rounds.push({ n: roundN, direction: dir, scores, moonShooter });
    if(g.mode==="play") g.playState = null;
    saveState();
    const totals = computeTotals(g);
    const overTarget = g.seating.filter(id=> totals[id] >= g.targetScore);
    if(overTarget.length>0){
      ui.modal = {
        type: "gameEndSuggest",
        title: "Elérte valaki a céllépést",
        body: `${overTarget.map(playerName).join(", ")} elérte vagy túllépte a ${g.targetScore} pontot. Lezárod a játékot?`,
        confirmLabel: "Lezárás",
        cancelLabel: g.mode==="play" ? "Új leosztás" : "Folytatás"
      };
    } else if(g.mode==="play"){
      startNewPlayRound(g);
    }
  }


  function computeTotals(game){
    const totals = {};
    game.seating.forEach(id=> totals[id]=0);
    game.rounds.forEach(r=>{
      game.seating.forEach(id=>{
        totals[id] += (r.scores[id]||0);
      });
    });
    return totals;
  }

  function computeStats(playerId, sessionId){
    let finished = state.games.filter(g=>g.finished && g.seating.includes(playerId));
    if(sessionId!==undefined) finished = finished.filter(g=> (g.sessionId||null) === sessionId);
    const gamesPlayed = finished.length;
    const wins = finished.filter(g=>g.winnerId===playerId).length;
    const losses = finished.filter(g=>g.loserId===playerId).length;
    const scores = finished.map(g=> computeTotals(g)[playerId] || 0);
    const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : null;
    const best = scores.length ? Math.min(...scores) : null;
    let moonShots = 0;
    finished.forEach(g=> g.rounds.forEach(r=>{ if(r.moonShooter===playerId) moonShots++; }));
    return { gamesPlayed, wins, losses, avg, best, moonShots };
  }

  function activeGame(){
    if(!state.activeGameId) return null;
    const g = state.games.find(g=>g.id===state.activeGameId);
    return (g && !g.finished) ? g : null;
  }

          <label class="field-label">Gép ${slot}</label>
          <div class="chip-grid">
            ${[["easy","Könnyű"],["medium","Közepes"],["hard","Nehéz"],["expert","Profi"]].map(([val,label])=>`
              <div class="chip ${current===val?'selected':''}" data-action="setPlayDifficulty" data-id="${slot}:${val}">${label}</div>
            `).join("")}
          </div>
        </div>`;
      }).join("")}
      <p class="muted" style="margin-bottom:0;">Könnyű: nagyjából véletlenszerű, csak a durva hibákat kerüli. Közepes: óvatosan kerüli a veszélyes lapokat. Nehéz: azt is figyeli, ki melyik színben üres, és ezt hívja ki ellene. Profi: számolja a kiment lapokat, tudatosan üresíti ki magát egy színben, időben kivezényli a magas lapjait bármelyik színből (nem csak pirosból) mielőtt csapdává válnának — de sosem úgy, hogy egy még kint lévő zöld felsőt elfogna vele —, az alacsony piros lapokat inkább megtartja (ritkán visz velük ütést), ha elég erős a keze megpróbálja levinni az egész kört, és ha úgyis pontot kell írnia, a lehető legmagasabb, azonos pontozású lappal viszi, hogy alacsonyabb tartalék lapja maradjon.</p>
    </div>` : ""}
    <div class="panel">
      <div class="panel-title">Ülésrend</div>
      <p class="muted" style="margin-top:-6px;">Ez határozza meg, ki kezd és ki oszt elsőként — bárkit áthelyezhetsz, embert és gépet is.</p>
      ${ui.playSeatOrder.map((id,idx)=>{
        const label = id.startsWith("ai-") ? "Gép "+id.split("-")[1] : playerName(id);
        return `<div class="roster-row">
          <div class="roster-name">${idx+1}. ${escapeHtml(label)}</div>
          <div class="btn-row" style="width:auto;">
            <span class="icon-btn" data-action="movePlaySeatUp" data-id="${id}">↑</span>
            <span class="icon-btn" data-action="movePlaySeatDown" data-id="${id}">↓</span>
          </div>
        </div>`;
      }).join("")}
      <button class="btn btn-ghost" data-action="randomizePlaySeatOrder">🎲 Sorsolás</button>
    </div>
    <div class="panel">
      <div class="panel-title">Céllépés</div>
      <div class="target-row">
        <input type="number" id="playTargetScoreInput" value="${ui.playTargetScore}" min="10" step="10">
        <span class="muted">pontnál a program jelzi, hogy vége a partinak</span>
      </div>
      <button class="btn btn-primary" data-action="startPlayGame" ${ui.playSetupHumans.length>=1 && ui.playSetupHumans.length<=4? "":"disabled style='opacity:0.4;pointer-events:none;'"}>Indítás</button>
    </div>
    `;
    return html;
  }

  function renderActiveGame(){
    const g = activeGame();
    if(!g){ ui.screen="dashboard"; return renderDashboard(); }
    if(g.mode==="play") return renderPlayTable(g);
    const roundN = g.rounds.length + 1;
    const dir = directionForRound(roundN);
    const totals = computeTotals(g);
    const sorted = [...g.seating].sort((a,b)=>totals[a]-totals[b]);
    const leaderId = sorted[0];

    let html = `<div class="back-link" data-action="goDashboard">‹ Főoldal</div>`;

    // passing indicator
    html += `<div class="panel pass-card">
      <div class="pass-round-label">${roundN}. kör</div>
      <div class="pass-direction-label">${DIR_LABEL[dir]}</div>
      <div class="muted" style="margin-bottom:14px;">${DIR_SUB[dir]}</div>`;

    if(dir==="hold"){
      html += `<div class="cat-sleep">🐈‍⬛💤</div>`;
    } else if(dir==="across"){
      html += `<div class="pass-cross-note">
        <b>${escapeHtml(playerName(g.seating[0]))}</b> ⇄ <b>${escapeHtml(playerName(g.seating[2]))}</b><br>
        <b>${escapeHtml(playerName(g.seating[1]))}</b> ⇄ <b>${escapeHtml(playerName(g.seating[3]))}</b>
      </div>`;
    } else {
      const order = dir==="left" ? [0,1,2,3] : [0,3,2,1];
      let pairs = [];
      for(let i=0;i<4;i++){
        const fromIdx = order[i], toIdx = order[(i+1)%4];
        pairs.push(`<b>${escapeHtml(playerName(g.seating[fromIdx]))}</b> → <b>${escapeHtml(playerName(g.seating[toIdx]))}</b>`);
      }
      html += `<div class="pass-cross-note">${pairs.join("<br>")}</div>`;
    }
    html += `</div>`;

    // totals
    html += `<div class="panel"><div class="panel-title">Állás</div>`;
    sorted.forEach(id=>{
      html += `<div class="total-row">
        <span class="total-name">${escapeHtml(playerName(id))}${id===leaderId? '<span class="leader-tag">VEZET</span>':''}</span>
        <span class="total-val">${totals[id]} ${remainingLabel(totals[id], g.targetScore)}</span>
      </div>`;
    });
    html += `</div>`;

    // round entry
    html += `<div class="panel">
      <div class="panel-title">${roundN}. kör rögzítése</div>
      <div class="moon-toggle">
        <input type="checkbox" id="moonCheckbox" ${ui.moonMode? "checked":""}>
        <label for="moonCheckbox">Valaki levitte az összes ütést (hold)</label>
      </div>`;

    if(ui.moonMode){
      html += `<div class="moon-select-wrap">
        <label class="field-label">Ki vitte el mindet?</label>
        <select id="moonPlayerSelect" style="width:100%;padding:10px;border-radius:5px;background:rgba(0,0,0,0.25);color:var(--cream);border:1px solid var(--line);font-size:14px;">
          <option value="">Válassz…</option>
          ${g.seating.map(id=>`<option value="${id}" ${ui.moonPlayer===id?"selected":""}>${escapeHtml(playerName(id))}</option>`).join("")}
        </select>
      </div>
      <p class="muted">A kiválasztott játékos 0 pontot, a másik három 19-et ír ehhez a körhöz.</p>`;
    } else {
      let sum = 0;
      g.seating.forEach(id=>{
        const v = ui.roundInputs[id];
        sum += (v===undefined || v==="") ? 0 : Number(v);
      });
      html += g.seating.map(id=>{
        const v = ui.roundInputs[id];
        return `<div class="round-input-row">
          <span class="rname">${escapeHtml(playerName(id))}</span>
          <input type="number" min="0" class="round-input" data-id="${id}" value="${v===undefined?'':v}" placeholder="0">
        </div>`;
      }).join("");
      html += `<div class="sum-note ${sum!==19?'warn':''}">Összesen: ${sum} pont (egy teljes körben általában 19)</div>`;
    }

    html += `<button class="btn btn-primary" data-action="saveRound">Kör mentése</button>
      <button class="btn btn-danger" data-action="endGamePrompt">Játék lezárása</button>
    </div>`;

    // history table
    if(g.rounds.length>0){
      html += `<div class="panel"><div class="panel-title">Körök előzménye</div>
        <p class="muted" style="margin-top:-6px;">Koppints egy sorra, ha javítani szeretnéd.</p>
        <div style="overflow-x:auto;">
        <table class="score-grid">
          <thead><tr><th>Kör</th>${g.seating.map(id=>`<th>${escapeHtml(playerName(id)).slice(0,6)}</th>`).join("")}</tr></thead>
          <tbody>
          ${g.rounds.map((r,idx)=>`<tr data-action="startEditRound" data-id="${idx}" style="cursor:pointer;">
            <td class="rnd">${r.n}${r.moonShooter? ' <span class="moon-tag">🐈‍⬛</span>':''} ✎</td>
            ${g.seating.map(id=>`<td>${r.scores[id]||0}</td>`).join("")}
          </tr>`).join("")}
          </tbody>
          <tfoot><tr><td>Össz.</td>${g.seating.map(id=>`<td>${totals[id]}</td>`).join("")}</tr></tfoot>
        </table>
        </div>
      </div>`;
    }
    html += renderRoundEditForm(g);
    html += seatingDiagram(g, dir);

    return html;
  }

  function seatingDiagram(g, direction){
    const positions = [{x:100,y:26},{x:174,y:100},{x:100,y:174},{x:26,y:100}];
    let arrows = "";
    if(direction!=="hold"){
      g.seating.forEach((id, i)=>{
        const recipient = getPassRecipient(g.seating, direction, id);
        const toIdx = g.seating.indexOf(recipient);
        if(toIdx===i) return;
        const p1 = positions[i], p2 = positions[toIdx];
        arrows += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="var(--wine-bright)" stroke-width="1.5" opacity="0.55" marker-end="url(#seatArrow)"/>`;
      });
    }
    const seats = positions.map((p,i)=>{
      const name = playerName(g.seating[i]);
      return `<circle cx="${p.x}" cy="${p.y}" r="24" fill="var(--felt-dark)" stroke="var(--gold)" stroke-width="1.5"/>
        <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="10" fill="var(--cream)">${escapeHtml(name).slice(0,6)}</text>`;
    }).join("");
    return `<div class="seating-diagram-wrap">
      <svg width="170" height="170" viewBox="0 0 200 200">
        <defs><marker id="seatArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="var(--wine-bright)"/></marker></defs>
        ${arrows}
        ${seats}
      </svg>
    </div>`;
  }

  function cardChip(card, opts){
    opts = opts || {};
    const cls = ["playcard", "pc-"+card.suit];
    if(opts.selected) cls.push("selected");
    if(opts.disabled) cls.push("disabled");
    if(opts.received) cls.push("received-card");
    const action = opts.action ? `data-action="${opts.action}"` : "";
    const numericRank = parseInt(card.rank, 10);
    let faceMarkup;
    if(!isNaN(numericRank)){
      const count = numericRank;
      const icons = [];
      for(let i=0;i<count;i++) icons.push(`<svg class="pc-pip" viewBox="0 0 100 100">${SUIT_ICON[card.suit]}</svg>`);
      faceMarkup = `<div class="pc-pip-grid pc-pip-count-${count}">${icons.join("")}</div>`;
    } else if(card.rank==="AS"){
      faceMarkup = `<svg class="pc-icon-svg" viewBox="0 0 100 100">${SUIT_ICON[card.suit]}</svg>`;
    } else {
      faceMarkup = `<div class="pc-figure-wrap">
        <svg class="pc-figure-svg" viewBox="0 0 100 100">${FIGURE_ICON[card.rank]}</svg>
        <svg class="pc-icon-svg pc-icon-svg-small" viewBox="0 0 100 100">${SUIT_ICON[card.suit]}</svg>
      </div>`;
    }
    return `<div class="${cls.join(' ')}" ${action} data-id="${card.id}" title="${RANK_LABEL[card.rank]} ${SUIT_LABEL[card.suit]}">
      ${opts.received ? `<span class="received-tag">ÚJ</span>` : ""}
      <div class="pc-corner pc-corner-top">${RANK_SHORT[card.rank]}</div>
      ${faceMarkup}
      <div class="pc-corner pc-corner-bottom">${RANK_SHORT[card.rank]}</div>
    </div>`;
  }

  function wonCardsPanel(ps, seatId){
    const cards = (ps.wonCards && ps.wonCards[seatId]) || [];
    let html = `<div class="panel">`;
    if(ui.showWonCards){
      html += `<div class="panel-title">Az elvitt lapjaid ebben a körben (${cards.length})</div>`;
      if(cards.length===0){
        html += `<div class="empty-msg">Még nem vittél ütést ebben a körben.</div>`;
      } else {
        html += `<div class="hand-row">${cards.map(c=>cardChip(c, {disabled:true})).join("")}</div>`;
      }
      html += `<button class="btn btn-ghost" data-action="toggleWonCards" style="margin-top:10px;">Elrejtés</button>`;
    } else {
      html += `<button class="btn btn-ghost" data-action="toggleWonCards">Elvitt lapjaim megtekintése (${cards.length})</button>`;
    }
    html += `</div>`;
    return html;
  }

  function revealGate(seatId, seatName, action){
    return `<div class="panel reveal-gate">
      <div class="cat">🐈‍⬛</div>
      <p style="margin-bottom:16px;">Add át a készüléket <b>${escapeHtml(seatName)}</b>-nak/nek.</p>
      <button class="btn btn-primary" data-action="${action}" data-id="${seatId}">Lapjaim megtekintése</button>
    </div>`;
  }

  function renderPlayTable(g){
    const ps = g.playState;
    const totals = computeTotals(g);
    let html = `<div class="back-link" data-action="${g.online?'goDashboardKeepRoom':'goDashboard'}">‹ Főoldal</div>`;
    if(g.online){ html += ` <div class="back-link" data-action="leaveOnlineRoom" style="color:var(--wine-bright); margin-left:14px;">Kilépés a szobából</div>`; }

    if(g.finished){
      html += `<div class="panel"><div class="panel-title">Vége a partinak</div>`;
      [...g.seating].sort((a,b)=>totals[a]-totals[b]).forEach(id=>{
        html += `<div class="total-row">
          <span class="total-name">${escapeHtml(playerName(id))}${id===g.winnerId? ' <span class="leader-tag">GYŐZTES</span>':''}${id===g.loserId? ' 💩':''}</span>
          <span class="total-val">${totals[id]}</span>
        </div>`;
      });
      html += `</div><button class="btn btn-primary" data-action="leaveOnlineRoom">Vissza a főoldalra</button>`;
      return html;
    }

    if(!ps){
      if(!g.online && !ui.modal){
        const overTarget = g.seating.filter(id=> totals[id] >= g.targetScore);
        if(overTarget.length>0){
          ui.modal = {
            type: "gameEndSuggest",
            title: "Elérte valaki a céllépést",
            body: `${overTarget.map(playerName).join(", ")} elérte vagy túllépte a ${g.targetScore} pontot. Lezárod a játékot?`,
            confirmLabel: "Lezárás",
            cancelLabel: "Új leosztás"
          };
        } else {
          startNewPlayRound(g);
          return renderPlayTable(g);
        }
      }
      html += `<div class="panel"><div class="empty-msg">A leosztás előkészítése…</div></div>`;
      return html;
    }

    const roundN = ps.roundN;
    const dealerId = g.seating[(roundN-1)%4];
    html += `<div class="panel pass-card">
      <div class="pass-round-label">${roundN}. kör</div>
      <div class="pass-direction-label">${DIR_LABEL[ps.direction]}</div>
      <p class="muted" style="margin-top:2px;">Osztó: ${escapeHtml(playerName(dealerId))} · Kezd: ${escapeHtml(playerName(ps.trickLeaderSeatId))}</p>
    </div>`;

    // totals + élő pontállás ebben a körben (a végén jelenik meg, a játéktér alatt)
    let standingsHtml = `<div class="panel"><div class="panel-title">Állás</div>`;
    [...g.seating].sort((a,b)=>totals[a]-totals[b]).forEach(id=>{
      const live = ps.collectedPoints[id] || 0;
      standingsHtml += `<div class="total-row">
        <span class="total-name">${escapeHtml(playerName(id))}${isAI(g,id)?` <span class="muted">(AI, ${DIFF_LABEL[getAiDifficulty(g,id)]})</span>`:''}</span>
        <span class="total-val">${totals[id]}${live? ` <span class="muted" style="font-size:12px;">(+${live})</span>`:''} ${remainingLabel(totals[id], g.targetScore)}</span>
      </div>`;
    });
    standingsHtml += `</div>`;
    standingsHtml += seatingDiagram(g, ps.direction);

    if(ps.phase==="passing"){
      html += `<div class="panel">
        <div class="panel-title">Ki kinek ad</div>
        ${g.seating.map(id=>{
          const recipient = getPassRecipient(g.seating, ps.direction, id);
          return `<p class="pass-cross-note" style="margin:0 0 6px;"><b>${escapeHtml(playerName(id))}</b> → <b>${escapeHtml(playerName(recipient))}</b></p>`;
        }).join("")}
      </div>`;

      if(g.online){
        const mySeatId = ui.online.deviceId;
        const submittedCount = g.seating.filter(id=> ps.passSelections[id]).length;
        html += `<div class="panel"><p class="muted" style="margin:0;">Eddig ${submittedCount}/4 játékos adta le a lapjait.</p></div>`;
        if(!g.humanIds.includes(mySeatId)){
          html += `<div class="panel"><div class="empty-msg">Csak nézed ezt a partit, nem ülsz az asztalnál.</div></div>`;
          return html + standingsHtml;
        }
        if(ps.passSelections[mySeatId]){
          html += `<div class="panel"><div class="empty-msg">Leadtad a lapjaidat, várunk a többiekre…</div></div>`;
          return html + standingsHtml;
        }
        const hand = ps.hands[mySeatId];
        html += `<div class="panel">
          <div class="panel-title">Válassz 2 lapot, amit tovább adsz</div>
          <div class="hand-row">
            ${hand.map(c=>{
              const selected = ui.playSelectedCards.includes(c.id);
              return cardChip(c, {selected, action:"onlineSelectPassCard"});
            }).join("")}
          </div>
          <button class="btn btn-primary" data-action="onlineConfirmPass" ${ui.playSelectedCards.length===2? "":"disabled style='opacity:0.4;pointer-events:none;'"}>Adok</button>
        </div>`;
        return html + standingsHtml;
      }

      const currentHumanId = ps.passQueueHumans[0];
      if(!currentHumanId){
        html += `<div class="panel"><div class="empty-msg">A lapadás folyamatban…</div></div>`;
        return html + standingsHtml;
      }
      if(g.humanIds.length>1 && ui.playRevealedSeatId !== currentHumanId){
        html += revealGate(currentHumanId, playerName(currentHumanId), "revealHand");
        return html + standingsHtml;
      }
      const hand = ps.hands[currentHumanId];
      html += `<div class="panel">
        <div class="panel-title">${escapeHtml(playerName(currentHumanId))} – válassz 2 lapot, amit tovább adsz</div>
        <div class="hand-row">
          ${hand.map(c=>{
            const selected = ui.playSelectedCards.includes(c.id);
            return cardChip(c, {selected, action:"selectPassCard"});
          }).join("")}
        </div>
        <button class="btn btn-primary" data-action="confirmPass" ${ui.playSelectedCards.length===2? "":"disabled style='opacity:0.4;pointer-events:none;'"}>Adok</button>
      </div>`;
      return html + standingsHtml;
    }

    if(ps.phase==="trickResult"){
      const lt = ps.lastTrick;
      html += `<div class="panel">
        <div class="panel-title">${lt.trickNumber}. ütés</div>
        <div class="trick-row">
          ${g.seating.map(id=>{
            const entry = lt.cards.find(e=>e.seatId===id);
            const won = id===lt.winnerId;
            return `<div class="trick-slot">
              <div class="tname">${escapeHtml(playerName(id))}</div>
              ${entry? cardChip(entry.card, {disabled:!won}) : `<div class="empty-slot"></div>`}
            </div>`;
          }).join("")}
        </div>
        <p class="muted" style="text-align:center;">Az ütést <b>${escapeHtml(playerName(lt.winnerId))}</b> vitte${lt.points>0? ` (+${lt.points} pont)`:''}.</p>
        ${lt.trickNumber===8 ? `<p class="muted" style="text-align:center;">Ez volt a kör utolsó ütése.</p>` : ""}`;
      if(g.online){
        const mySeatId = ui.online.deviceId;
        const acks = ps.trickAcks || {};
        html += `<p class="muted" style="text-align:center;">${g.humanIds.map(id=> `${escapeHtml(playerName(id))}${acks[id]?' ✓':' …'}`).join(" · ")}</p>`;
        if(acks[mySeatId]){
          html += `<p class="muted" style="text-align:center;">Vársz a többiekre…</p>`;
        } else {
          html += `<button class="btn btn-primary" data-action="onlineAckTrick">${lt.trickNumber===8? "Kör lezárása":"Következő ütés"}</button>`;
        }
      } else {
        html += `<button class="btn btn-primary" data-action="continueTrick">${lt.trickNumber===8? "Kör lezárása":"Következő ütés"}</button>`;
      }
      html += `</div>`;
      return html + standingsHtml;
    }

    // phase === "playing"
    const actingId = getActingSeatId(g);
    const ledSuit = ps.currentTrick.length ? ps.currentTrick[0].card.suit : null;
    html += `<div class="panel">
      <div class="panel-title">${ps.trickIndex+1}. ütés</div>
      ${ledSuit ? `<p class="muted" style="margin-top:-6px;">Hívott szín: <b>${SUIT_LABEL[ledSuit]}</b> · hívta: <b>${escapeHtml(playerName(ps.trickLeaderSeatId))}</b></p>` : `<p class="muted" style="margin-top:-6px;"><b>${escapeHtml(playerName(ps.trickLeaderSeatId))}</b> kezdi az ütést.</p>`}
      <div class="trick-row">
        ${g.seating.map(id=>{
          const entry = ps.currentTrick.find(e=>e.seatId===id);
          const isLeader = id===ps.trickLeaderSeatId;
          const isActing = id===actingId;
          const slotCls = ["trick-slot"];
          if(isActing && !entry) slotCls.push("acting-slot");
          return `<div class="${slotCls.join(' ')}">
            <div class="tname">${escapeHtml(playerName(id))}${isLeader? ' <span class="leader-mark">hívott</span>':''}</div>
            <div class="trick-count-tag">${(ps.trickWinsCount && ps.trickWinsCount[id]) || 0} ütés</div>
            ${entry? cardChip(entry.card, {disabled:true}) : `<div class="empty-slot">${isActing? '<span class="turn-dot"></span>':''}</div>`}
            ${(!entry && isActing) ? `<div class="turn-label">most lép</div>` : (!entry ? `<div class="turn-label muted-label">vár</div>` : '')}
          </div>`;
        }).join("")}
      </div>
    </div>`;

    if(g.online){
      const mySeatId = ui.online.deviceId;
      if(!g.humanIds.includes(mySeatId)){
        html += `<div class="panel"><div class="empty-msg">Csak nézed ezt a partit, nem ülsz az asztalnál.</div></div>`;
        return html + standingsHtml;
      }
      const myTurn = actingId === mySeatId;
      if(isAI(g, actingId)){
        html += `<div class="panel"><p class="muted" style="margin:0;">${escapeHtml(playerName(actingId))} gondolkodik…</p></div>`;
      } else if(!myTurn){
        html += `<div class="panel"><p class="muted" style="margin:0;"><b>${escapeHtml(playerName(actingId))}</b> következik.</p></div>`;
      }
      const hand = ps.hands[mySeatId];
      const legal = myTurn ? getLegalCards(hand, ps.currentTrick).map(c=>c.id) : [];
      const received = ps.justReceived && ps.justReceived[mySeatId] ? ps.justReceived[mySeatId] : [];
      html += `<div class="panel">
        <div class="panel-title">A te lapjaid</div>
        ${received.length ? `<p class="muted" style="margin-top:-6px;">A <span class="received-mark">ÚJ</span> jelölésű lapokat ebben a körben kaptad a lapadáskor.</p>` : ""}
        <div class="hand-row">
          ${hand.map(c=> cardChip(c, {disabled: !legal.includes(c.id), action: legal.includes(c.id)? "onlinePlayHandCard":null, received: received.includes(c.id)})).join("")}
        </div>
      </div>`;
      html += wonCardsPanel(ps, mySeatId);
      return html + standingsHtml;
    }

    if(isAI(g, actingId)){
      html += `<div class="panel"><div class="empty-msg">${escapeHtml(playerName(actingId))} gondolkodik…</div></div>`;
      return html + standingsHtml;
    }

    if(g.humanIds.length>1 && ui.playRevealedSeatId !== actingId){
      html += revealGate(actingId, playerName(actingId), "revealHand");
      return html + standingsHtml;
    }

    const hand = ps.hands[actingId];
    const legal = getLegalCards(hand, ps.currentTrick).map(c=>c.id);
    const received = ps.justReceived && ps.justReceived[actingId] ? ps.justReceived[actingId] : [];
    html += `<div class="panel">
      <div class="panel-title">${escapeHtml(playerName(actingId))} lapjai</div>
      ${received.length ? `<p class="muted" style="margin-top:-6px;">A <span class="received-mark">ÚJ</span> jelölésű lapokat ebben a körben kaptad a lapadáskor.</p>` : ""}
      <div class="hand-row">
        ${hand.map(c=> cardChip(c, {disabled: !legal.includes(c.id), action: legal.includes(c.id)? "playHandCard":null, received: received.includes(c.id)})).join("")}
      </div>
    </div>`;
    html += wonCardsPanel(ps, actingId);
    return html + standingsHtml;
  }

            </div>
          </div>`;
        }).join("")}
      </div>`;
    }
    const closed = state.sessions.filter(s=>s.closed).sort((a,b)=> b.closedAt - a.closedAt);
    html += `<div class="panel">
      <div class="panel-title">Korábbi munkamenetek</div>`;

      html += `<div class="empty-msg">Még nincs lezárt munkamenet.</div>`;

      html += closed.map(s=>{

          <div class="hist-players muted">${new Date(s.createdAt).toLocaleDateString("hu-HU")} – ${new Date(s.closedAt).toLocaleDateString("hu-HU")}</div>
        </div>`;
      }).join("");

    html += `</div>`;

  function renderSessionDetail(){
    const s = state.sessions.find(s=>s.id===ui.sessionOpenId);
    if(!s){ ui.screen="sessions"; return renderSessionsScreen(); }
    let html = `<div class="back-link" data-action="goSessions">‹ Munkamenetek</div>`;
    html += `<div class="panel">
      <div class="panel-title">${escapeHtml(s.name)}</div>
      <p class="muted" style="margin-top:-6px;">${s.closed ? `Lezárva: ${new Date(s.closedAt).toLocaleDateString("hu-HU")}` : "Aktív munkamenet"}</p>
    </div>`;
    const sessionGames = state.games.filter(g=>g.finished && g.sessionId===s.id);
    const playerIds = Array.from(new Set(sessionGames.flatMap(g=>g.seating))).filter(id=> state.players.some(p=>p.id===id));
    html += `<div class="panel"><div class="panel-title">Statisztika</div>`;
    if(playerIds.length===0){
      html += `<div class="empty-msg">Ebben a munkamenetben még nincs lezárt játék.</div>`;
    } else {
      playerIds.forEach(id=>{
        const st = computeStats(id, s.id);
        html += `<div class="roster-row">
          <div class="roster-name">${escapeHtml(playerName(id))}</div>
          <div class="roster-stats">
            <span>J: <b>${st.gamesPlayed}</b></span>
            <span>Gy: <b>${st.wins}</b></span>
            <span>💩: <b>${st.losses}</b></span>
            <span>Átl: <b>${st.avg!==null? st.avg.toFixed(1):"–"}</b></span>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
    html += `<div class="panel"><div class="panel-title">Játékok</div>`;
    if(sessionGames.length===0){
      html += `<div class="empty-msg">Nincs még játék ebben a munkamenetben.</div>`;
    } else {
      html += sessionGames.sort((a,b)=>b.finishedAt-a.finishedAt).map(g=>{
        const totals = computeTotals(g);
        const dateStr = new Date(g.finishedAt).toLocaleDateString("hu-HU");
        return `<div class="hist-card" data-action="openGame" data-id="${g.id}">
          <div class="hist-top"><span>${dateStr}</span><span>${g.rounds.length} kör</span></div>
          <div class="hist-players">
            ${g.seating.map(id=> `${id===g.winnerId?'<b>':''}${escapeHtml(playerName(id))} (${totals[id]})${id===g.winnerId?' 🏆</b>':''}${id===g.loserId?' 💩':''}`).join(" · ")}

        </div>`;
      }).join("");

    html += `</div>`;
    if(!s.closed){
      html += `<button class="btn btn-danger" data-action="closeSessionPrompt" data-id="${s.id}">Munkamenet lezárása</button>`;
    }
    html += `<button class="btn btn-danger" data-action="deleteSessionPrompt" data-id="${s.id}">Munkamenet törlése</button>`;
    return html;
  }

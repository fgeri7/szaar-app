  // ---------------- Actions ----------------
  function attachHandlers(){
    const app = document.getElementById("app");

    const npInput = document.getElementById("newPlayerInput");
    if(npInput){
      npInput.addEventListener("input", e=>{ ui.newPlayerName = e.target.value; });
      npInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ addPlayer(); }});
    }
    const nsInput = document.getElementById("newSessionInput");
    if(nsInput){
      nsInput.addEventListener("input", e=>{ ui.newSessionName = e.target.value; });
      nsInput.addEventListener("keydown", e=>{ if(e.key==="Enter"){ addSession(); }});
    }
    const obInput = document.getElementById("onboardingNameInput");
    if(obInput){
      obInput.addEventListener("input", e=>{
        ui.onboardingName = e.target.value;
        const btn = document.getElementById("onboardingConfirmBtn");
        if(btn){
          const ready = !!e.target.value.trim();
          btn.disabled = !ready;
          btn.style.opacity = ready ? "" : "0.4";
          btn.style.pointerEvents = ready ? "" : "none";
        }
      });
      obInput.addEventListener("keydown", e=>{ if(e.key==="Enter" && ui.onboardingName.trim()){ confirmOnboarding(); }});
    }
    const hnInput = document.getElementById("hostNameInput");
    if(hnInput){
      hnInput.addEventListener("input", e=>{
        ui.online.hostName = e.target.value;
        const btn = document.getElementById("createRoomBtn");
        if(btn){
          const ready = !!e.target.value.trim();
          btn.disabled = !ready;
          btn.style.opacity = ready ? "" : "0.4";
          btn.style.pointerEvents = ready ? "" : "none";
        }
      });
      hnInput.addEventListener("keydown", e=>{ if(e.key==="Enter" && ui.online.hostName.trim()){ createOnlineRoom(); }});
    }
    const jcInput = document.getElementById("joinCodeInput");
    const jnInput = document.getElementById("joinNameInput");
    function syncJoinBtn(){
      const btn = document.getElementById("joinRoomBtn");
      if(!btn) return;
      const ready = ui.online.joinName.trim() && ui.online.joinCodeInput.trim();
      btn.disabled = !ready;
      btn.style.opacity = ready ? "" : "0.4";
      btn.style.pointerEvents = ready ? "" : "none";
    }
    if(jcInput){ jcInput.addEventListener("input", e=>{ ui.online.joinCodeInput = e.target.value; syncJoinBtn(); }); }
    if(jnInput){ jnInput.addEventListener("input", e=>{ ui.online.joinName = e.target.value; syncJoinBtn(); }); }
    const lobbyTsInput = document.getElementById("lobbyTargetScoreInput");
    if(lobbyTsInput){
      lobbyTsInput.addEventListener("change", e=>{
        const val = Number(e.target.value)||100;
        if(ui.online.room) roomDocRef(ui.online.code).update({ targetScore: val }).catch(()=>{});
      });
    }
    const tsInput = document.getElementById("targetScoreInput");
    if(tsInput){
      tsInput.addEventListener("input", e=>{ ui.targetScore = Number(e.target.value)||100; });
    }
    const ptsInput = document.getElementById("playTargetScoreInput");
    if(ptsInput){
      ptsInput.addEventListener("input", e=>{ ui.playTargetScore = Number(e.target.value)||100; });
    }
    document.querySelectorAll(".round-input").forEach(inp=>{
      inp.addEventListener("input", e=>{
        ui.roundInputs[e.target.dataset.id] = e.target.value;
        // live-update the sum note without full rerender to keep focus
        const g = activeGame();
        if(g){
          let sum=0;
          g.seating.forEach(id=>{
            const v = ui.roundInputs[id];
            sum += (v===undefined||v==="")?0:Number(v);
          });
          const note = app.querySelector(".sum-note");
          if(note){
            note.textContent = `Összesen: ${sum} pont (egy teljes körben általában 19)`;
            note.classList.toggle("warn", sum!==19);
          }
        }
      });
    });
    const moonCb = document.getElementById("moonCheckbox");
    if(moonCb){
      moonCb.addEventListener("change", e=>{ ui.moonMode = e.target.checked; ui.moonPlayer=null; render(); });
    }
    const moonSel = document.getElementById("moonPlayerSelect");
    if(moonSel){
      moonSel.addEventListener("change", e=>{ ui.moonPlayer = e.target.value || null; });
    }
    document.querySelectorAll(".edit-round-input").forEach(inp=>{
      inp.addEventListener("input", e=>{ ui.editRoundInputs[e.target.dataset.id] = e.target.value; });
    });
    const editMoonCb = document.getElementById("editMoonCheckbox");
    if(editMoonCb){
      editMoonCb.addEventListener("change", e=>{ ui.editRoundMoonMode = e.target.checked; ui.editRoundMoonPlayer=null; render(); });
    }
    const editMoonSel = document.getElementById("editMoonPlayerSelect");
    if(editMoonSel){
      editMoonSel.addEventListener("change", e=>{ ui.editRoundMoonPlayer = e.target.value || null; });
    }

    if(!app.dataset.clickBound){
      app.addEventListener("click", onAppClick);
      app.dataset.clickBound = "1";
    }
  }

  function onAppClick(e){
    const stopEl = e.target.closest("[data-stop]");
    if(stopEl && e.target===stopEl) return; // clicks inside modal box shouldn't close it via backdrop
    const el = e.target.closest("[data-action]");
    if(!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    switch(action){
      case "goDashboard": ui.screen="dashboard"; render(); break;
      case "selectMyPlayer": state.myPlayerId=id; saveState(); ui.screen="dashboard"; render(); break;
      case "confirmOnboarding": confirmOnboarding(); break;
      case "goPlayers": ui.newPlayerName=""; ui.screen="players"; render(); break;
      case "goNewGame": ui.selectedSeating=[]; ui.targetScore=100; ui.screen="newGame"; render(); break;
      case "goPlaySetup": ui.playSetupHumans=[]; ui.playSeatOrder=[]; ui.playTargetScore=100; ui.playPerAiDifficulty={1:"medium",2:"medium",3:"medium",4:"medium"}; ui.screen="playSetup"; render(); break;
      case "goOnlineHome": ui.online.error=null; ui.screen="onlineHome"; render(); break;
      case "goOnlineActive": ui.screen=id; render(); break;
      case "goOnlineCreate": ui.online.error=null; ui.online.hostName = state.myPlayerId? playerName(state.myPlayerId) : ui.online.hostName; ui.screen="onlineCreate"; render(); break;
      case "goOnlineJoin": ui.online.error=null; ui.online.joinName = state.myPlayerId? playerName(state.myPlayerId) : ui.online.joinName; ui.screen="onlineJoin"; render(); break;
      case "createOnlineRoom": createOnlineRoom(); break;
      case "joinOnlineRoom": joinOnlineRoom(); break;
      case "leaveOnlineRoom": leaveOnlineRoom(); break;
      case "goDashboardKeepRoom": goDashboardKeepRoom(); break;
      case "moveSeatUp": moveSeat(id, -1); break;
      case "moveSeatDown": moveSeat(id, 1); break;
      case "randomizeSeatOrder": randomizeSeatOrder(); break;
      case "setLobbyAiDifficulty": {
        const [slot, val] = id.split(":");
        setLobbyAiDifficulty(Number(slot), val);
        break;
      }
      case "startOnlineGame": startOnlineGame(); break;
      case "onlineSelectPassCard": togglePassCardSelection(id); break;
      case "onlineConfirmPass": onlineSubmitPass(); break;
      case "onlinePlayHandCard": onlinePlayCard(id); break;
      case "onlineAckTrick": onlineAckTrick(); break;
      case "togglePlayHuman": togglePlayHuman(id); break;
      case "movePlaySeatUp": movePlaySeat(id, -1); break;
      case "movePlaySeatDown": movePlaySeat(id, 1); break;
      case "randomizePlaySeatOrder": randomizePlaySeatOrder(); break;
      case "setPlayDifficulty": {
        const [slot, val] = id.split(":");
        ui.playPerAiDifficulty[Number(slot)] = val;
        render();
        break;
      }
      case "startPlayGame": startPlayGame(); break;
      case "revealHand": ui.playRevealedSeatId = id; render(); break;
      case "toggleWonCards": ui.showWonCards = !ui.showWonCards; render(); break;
      case "startEditRound": startEditRound(Number(id)); break;
      case "cancelEditRound": cancelEditRound(); break;
      case "saveEditRound": saveEditRound(); break;
      case "selectPassCard": togglePassCardSelection(id); break;
      case "confirmPass": confirmPass(); break;
      case "playHandCard": playHumanCard(id); break;
      case "continueTrick": continueTrick(); break;
      case "goHistory": ui.screen="history"; render(); break;
      case "goSessions": ui.newSessionName=""; ui.screen="sessions"; render(); break;
      case "addSession": addSession(); break;
      case "openSession": ui.sessionOpenId=id; ui.screen="sessionDetail"; render(); break;
      case "closeSessionPrompt": closeSessionPrompt(id); break;
      case "pauseSession": pauseSession(); break;
      case "resumeSession": resumeSession(id); break;
      case "deleteSessionPrompt": deleteSessionPrompt(id); break;
      case "continueGame": ui.roundInputs={}; ui.moonMode=false; ui.moonPlayer=null; ui.playRevealedSeatId=null; ui.playSelectedCards=[]; ui.screen="activeGame"; render(); break;
      case "addPlayer": addPlayer(); break;
      case "deletePlayer": deletePlayer(id); break;
      case "renamePlayer": renamePlayer(id); break;
      case "toggleSeat": toggleSeat(id); break;
      case "startGame": startGame(); break;
      case "saveRound": saveRound(); break;
      case "endGamePrompt": confirmEndGame(); break;
      case "resetStatsPrompt": resetStatsPrompt(); break;
      case "openGame": ui.historyOpenId=id; ui.screen="gameDetail"; render(); break;
      case "closeModal": ui.modal=null; render(); break;
      case "modalCancel": handleModalCancel(); break;
      case "modalConfirm": handleModalConfirm(); break;
    }
  }

  function addPlayer(){
    const name = ui.newPlayerName.trim();
    if(!name){ return; }
    const exists = state.players.some(p=>p.name.toLowerCase()===name.toLowerCase());
    if(exists){ showToast("Már van ilyen nevű játékos."); return; }
    state.players.push({ id: uid(), name });
    ui.newPlayerName = "";
    saveState();
    render();
  }

  function confirmOnboarding(){
    const name = ui.onboardingName.trim();
    if(!name) return;
    const existing = state.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
    if(existing){
      state.myPlayerId = existing.id;
    } else {
      const p = { id: uid(), name };
      state.players.push(p);
      state.myPlayerId = p.id;
    }
    ui.onboardingName = "";
    saveState();
    ui.screen = "dashboard";
    render();
  }

  function renamePlayer(playerId){
    const p = state.players.find(p=>p.id===playerId);
    if(!p) return;
    let newName = null;
    try{ newName = window.prompt("Új név:", p.name); }catch(e){ return; }
    if(newName===null) return;
    newName = newName.trim();
    if(!newName) return;
    p.name = newName;
    saveState();
    render();
  }

  function addSession(){
    const name = ui.newSessionName.trim();
    if(!name){ return; }
    // a korábbi aktív munkamenetet csak szüneteltetjük, nem zárjuk le
    state.activeSessionId = null;
    const session = { id: uid(), name, createdAt: Date.now(), closed: false, closedAt: null };
    state.sessions.push(session);
    state.activeSessionId = session.id;
    ui.newSessionName = "";
    saveState();
    render();
  }

  function pauseSession(){
    state.activeSessionId = null;
    saveState();
    render();
  }

  function resumeSession(sessionId){
    const s = state.sessions.find(s=>s.id===sessionId);
    if(!s || s.closed) return;
    state.activeSessionId = sessionId;
    saveState();
    render();
  }

  function closeSessionPrompt(sessionId){
    const s = state.sessions.find(s=>s.id===sessionId);
    if(!s) return;
    ui.modal = {
      type: "closeSession",
      sessionId,
      title: "Munkamenet lezárása",

  function listenToRoom(code){
    if(ui.online.unsubscribe){ ui.online.unsubscribe(); ui.online.unsubscribe = null; }
    ui.online.code = code;
    const ref = roomDocRef(code);
    ui.online.unsubscribe = ref.onSnapshot(function(doc){
      if(!doc.exists){
        showToast("A szoba megszűnt.");
        leaveOnlineRoom();
        return;
      }
      const room = doc.data();
      ui.online.room = room;
      ui.online.isHost = (room.hostDeviceId === ui.online.deviceId);
      if(room.status==="playing" && ui.screen!=="onlineGame") ui.screen = "onlineGame";
      if(room.status==="lobby" && ui.screen==="onlineGame") ui.screen = "onlineLobby";
      render();
      if(room.status==="finished") maybeSaveOnlineGameLocally(room);
      if(room.status==="playing" && room.game && !room.game.finished && ui.online.isHost){
        maybeAutoPlayAiTurn(room.game);
      }
      if(room.status==="lobby" && ui.online.isHost){
        const humanIds = room.players.map(p=>p.deviceId);
        const aiCount = 4 - humanIds.length;
        const reconciled = reconcileSeatOrder(room.seatOrder, humanIds, aiCount);
        const changed = reconciled.length!==(room.seatOrder||[]).length || reconciled.some((id,i)=> id!==(room.seatOrder||[])[i]);
        if(changed){
          roomDocRef(code).update({ seatOrder: reconciled }).catch(()=>{});
        }
      }
    }, function(err){ console.warn("Szoba figyelési hiba", err); });
  }

  function leaveOnlineRoom(){
    const code = ui.online.code;
    const deviceId = ui.online.deviceId;
    const room = ui.online.room;
    const wasLobby = room && room.status==="lobby";
    const wasPlaying = room && room.status==="playing";
    const wasHost = ui.online.isHost;
    if(ui.online.unsubscribe){ ui.online.unsubscribe(); ui.online.unsubscribe = null; }
    if(code && isFirebaseAvailable()){
      const ref = roomDocRef(code);
      const db = ensureFirebaseInit();
      db.runTransaction(function(t){
        return t.get(ref).then(function(doc){
          if(!doc.exists) return;
          const r = doc.data();
          const updates = {};
          if(wasLobby){
            updates.players = r.players.filter(p=>p.deviceId!==deviceId);
          }
          if(wasHost && r.hostDeviceId===deviceId){
            const others = r.players.filter(p=>p.deviceId!==deviceId);
            if(others.length>0) updates.hostDeviceId = others[0].deviceId;
          }
          if(wasPlaying && r.game && !r.game.finished && r.game.humanIds && r.game.humanIds.includes(deviceId)){
            const game = r.game;
            const displayName = (game.humanNames && game.humanNames[deviceId]) || "Kilépett játékos";
            game.humanIds = game.humanIds.filter(id=>id!==deviceId);
            game.aiPlayers = game.aiPlayers || [];
            game.aiPlayers.push({ id: deviceId, name: displayName, difficulty: "easy" });
            const ps = game.playState;
            if(ps){
              if(ps.phase==="passing" && !ps.passSelections[deviceId]){
                const handToPass = ps.hands[deviceId] || [];
                ps.passSelections[deviceId] = aiChoosePass(handToPass, "easy").map(c=>c.id);
                if(game.seating.every(id=> ps.passSelections[id])) executePass(game);
              }
              if(game.playState && game.playState.phase==="trickResult"){
                const ps2 = game.playState;
                const allAcked = game.humanIds.every(id=> (ps2.trickAcks||{})[id]);
                if(allAcked){
                  const lt = ps2.lastTrick;
                  if(lt.trickNumber===8){
                    let moonShooter=null; const scores={};
                    const moonSeat = game.seating.find(id=>(ps2.trickWinsCount && ps2.trickWinsCount[id])===8);
                    if(moonSeat){ moonShooter=moonSeat; game.seating.forEach(id=>{scores[id]=(id===moonSeat)?0:19;}); }
                    else { game.seating.forEach(id=>{scores[id]=ps2.collectedPoints[id]||0;}); }
                    onlineCommitRound(game, scores, moonShooter);
                  } else {
                    ps2.trickLeaderSeatId = lt.winnerId;
                    ps2.trickIndex += 1;
                    ps2.currentTrick = [];
                    ps2.lastTrick = null;
                    ps2.phase = "playing";
                    processAiTurns(game);
                  }
                }
              }
              if(game.playState && game.playState.phase==="playing"){
                processAiTurns(game);
              }
            }
            updates.game = game;
            if(game.finished) updates.status = "finished";
          }
          if(Object.keys(updates).length>0){
            updates.updatedAt = Date.now();
            t.update(ref, updates);
          }
        });
      }).catch(()=>{});
    }
    ui.online.code = null;
    ui.online.room = null;
    ui.online.isHost = false;
    try{ localStorage.removeItem("szar-active-room"); }catch(e){}
    ui.screen = "dashboard";
    render();
  }

  function startOnlineGame(){
    if(!ui.online.isHost || !ui.online.room) return;
    const room = ui.online.room;
    const humanIds = room.players.map(p=>p.deviceId);
    const humanNames = {};
    room.players.forEach(p=>{ humanNames[p.deviceId] = p.name; });
    const aiCount = 4 - humanIds.length;
    const gameId = uid();
    const aiPlayers = [];
    for(let i=1;i<=aiCount;i++){
      aiPlayers.push({ id: "ai-"+gameId+"-"+i, name: "Gép "+i, difficulty: (room.aiDifficulty && room.aiDifficulty[i]) || "medium" });
    }
    const seatOrder = reconcileSeatOrder(room.seatOrder, humanIds, aiCount);
    const seating = seatOrder.map(id=>{
      if(id.startsWith("ai-")){
        const n = id.split("-")[1];
        const ai = aiPlayers[Number(n)-1];
        return ai ? ai.id : id;
      }
      return id;
    });
    const game = {
      id: gameId,
      createdAt: Date.now(),
      targetScore: room.targetScore || 100,
      mode: "play",
      online: true,
      roomCode: room.code,
      humanNames,
      seating,
      humanIds,
      aiPlayers,
      rounds: [],
      finished: false,
      finishedAt: null,
      winnerId: null,
      loserId: null,
      playState: null
    };
    startNewPlayRound(game);
    roomDocRef(room.code).update({ status:"playing", game, updatedAt: Date.now() }).catch(e=>{ showToast("Nem sikerült elindítani: "+e.message); });
  }

  function onlineTransactionUpdate(code, mutatorFn){
    const db = ensureFirebaseInit();
    if(!db) return Promise.reject(new Error("Nincs hálózati kapcsolat."));
    const ref = roomDocRef(code);
    return db.runTransaction(function(t){
      return t.get(ref).then(function(doc){
        if(!doc.exists) throw new Error("A szoba már nem létezik.");
        const room = doc.data();
        if(!room.game) throw new Error("A játék még nem indult el.");
        mutatorFn(room.game, room);
        const updates = { game: room.game, updatedAt: Date.now() };
        if(room.game.finished) updates.status = "finished";
        t.update(ref, updates);
      });
    });
  }

  function onlineSubmitPass(){
    if(ui.playSelectedCards.length!==2) return;
    const selected = [...ui.playSelectedCards];
    const code = ui.online.code;
    const deviceId = ui.online.deviceId;
    onlineTransactionUpdate(code, function(game){
      const ps = game.playState;
      if(!ps || ps.phase!=="passing") throw new Error("Már nem lehet lapot passzolni.");
      if(ps.passSelections[deviceId]) return;
      ps.passSelections[deviceId] = selected;
      const allIn = game.seating.every(id=> ps.passSelections[id]);
      if(allIn) executePass(game);
    }).then(()=>{ ui.playSelectedCards=[]; render(); }).catch(e=>{ showToast(e.message||"Hiba történt."); });
  }

  function onlinePlayCard(cardId){
    const code = ui.online.code;
    const deviceId = ui.online.deviceId;
    onlineTransactionUpdate(code, function(game){
      const ps = game.playState;
      if(!ps || ps.phase!=="playing") throw new Error("Most nem lehet lapot kijátszani.");
      const actingId = getActingSeatId(game);
      if(actingId!==deviceId) throw new Error("Nem te következel.");
      const hand = ps.hands[actingId];
      const card = hand.find(c=>c.id===cardId);
      if(!card) throw new Error("Ez a lap már nincs nálad.");
      const legal = getLegalCards(hand, ps.currentTrick);
      if(!legal.some(c=>c.id===cardId)) throw new Error("Ezt a lapot most nem játszhatod ki.");
      playCard(game, actingId, card);
    }).catch(e=>{ showToast(e.message||"Hiba történt."); });
  }

  function onlineCommitRound(game, scores, moonShooter){
    const roundN = game.rounds.length + 1;
    const dir = directionForRound(roundN);
    game.rounds.push({ n: roundN, direction: dir, scores, moonShooter });
    game.playState = null;
    const totals = computeTotals(game);
    const overTarget = game.seating.some(id=> totals[id] >= game.targetScore);
    if(overTarget){
      let winner=game.seating[0], loser=game.seating[0];
      game.seating.forEach(id=>{ if(totals[id]<totals[winner]) winner=id; if(totals[id]>totals[loser]) loser=id; });
      game.finished = true;
      game.finishedAt = Date.now();
      game.winnerId = winner;
      game.loserId = loser;
    } else {
      startNewPlayRound(game);
    }
  }

  function onlineAckTrick(){
    const code = ui.online.code;
    const deviceId = ui.online.deviceId;
    onlineTransactionUpdate(code, function(game){
      const ps = game.playState;
      if(!ps || ps.phase!=="trickResult") return;
      ps.trickAcks = ps.trickAcks || {};
      if(ps.trickAcks[deviceId]) return;
      ps.trickAcks[deviceId] = true;
      const allAcked = game.humanIds.every(id=> ps.trickAcks[id]);
      if(!allAcked) return;
      const lt = ps.lastTrick;
      if(lt.trickNumber===8){
        let moonShooter=null; const scores={};
        const moonSeat = game.seating.find(id=>(ps.trickWinsCount && ps.trickWinsCount[id])===8);
        if(moonSeat){ moonShooter=moonSeat; game.seating.forEach(id=>{scores[id]=(id===moonSeat)?0:19;}); }
        else { game.seating.forEach(id=>{scores[id]=ps.collectedPoints[id]||0;}); }
        onlineCommitRound(game, scores, moonShooter);
      } else {
        ps.trickLeaderSeatId = lt.winnerId;
        ps.trickIndex += 1;
        ps.currentTrick = [];
        ps.lastTrick = null;
        ps.phase = "playing";
        processAiTurns(game);
      }
    }).catch(()=>{});
  }

  function maybeAutoPlayAiTurn(game){
    const ps = game.playState;
    if(!ps || ps.phase!=="playing") return;
    const actingId = getActingSeatId(game);
    if(!isAI(game, actingId)) return;
    if(aiTurnPending) return;
    aiTurnPending = true;
    setTimeout(function(){
      onlineTransactionUpdate(ui.online.code, function(g){
        const ps2 = g.playState;
        if(!ps2 || ps2.phase!=="playing") return;
        const actingId2 = getActingSeatId(g);
        if(!isAI(g, actingId2)) return;
        const card = aiChooseCard(g, actingId2);
        playCard(g, actingId2, card);
      }).catch(()=>{}).then(function(){ aiTurnPending = false; }, function(){ aiTurnPending = false; });
    }, 700);
  }

  function maybeSaveOnlineGameLocally(room){
    const game = room.game;
    if(!game || !game.finished) return;
    if(savedOnlineGameIds[game.id]) return;
    savedOnlineGameIds[game.id] = true;
    if(state.games.some(g=>g.id===game.id)) return;
    if(!game.humanIds.includes(ui.online.deviceId)) return;
    const localCopy = Object.assign({}, game, { sessionId: state.activeSessionId || null });
    state.games.push(localCopy);
    saveState();
    render();
  }

  function saveEditRound(){
    const g = ui.screen==="gameDetail" ? state.games.find(g=>g.id===ui.historyOpenId) : activeGame();
    if(!g || !ui.editingRound) return;
    let scores = {};
    let moonShooter = null;
    if(ui.editRoundMoonMode){
      if(!ui.editRoundMoonPlayer){ showToast("Válaszd ki, ki vitte el az összes ütést."); return; }
      moonShooter = ui.editRoundMoonPlayer;
      g.seating.forEach(id=>{ scores[id] = (id===moonShooter) ? 0 : 19; });
    } else {
      g.seating.forEach(id=>{
        const v = ui.editRoundInputs[id];
        scores[id] = (v===undefined||v==="") ? 0 : Math.max(0, Number(v));
      });
    }
    const sum = Object.values(scores).reduce((a,b)=>a+b,0);
    if(!moonShooter && sum>19){
      ui.modal = {
        type: "editRound",
        title: "19 pontnál több",
        body: `A beírt pontok összege ${sum}, egy teljes kör viszont legfeljebb 19 pontot ér. Biztosan ezt szeretnéd rögzíteni?`,
        confirmLabel: "Mentés mégis",
        cancelLabel: "Vissza szerkeszteni",
        gameId: g.id,
        roundIndex: ui.editingRound.roundIndex,
        pendingScores: scores,
        pendingMoonShooter: moonShooter
      };
      render();
      return;
    }
    applyRoundEdit(g.id, ui.editingRound.roundIndex, scores, moonShooter);
  }

  function applyRoundEdit(gameId, roundIndex, scores, moonShooter){
    const g = state.games.find(g=>g.id===gameId) || activeGame();
    if(!g || !g.rounds[roundIndex]){ ui.editingRound = null; render(); return; }
    g.rounds[roundIndex] = Object.assign({}, g.rounds[roundIndex], { scores, moonShooter });
    if(g.finished){
      const totals = computeTotals(g);
      let winner = g.seating[0], loser = g.seating[0];
      g.seating.forEach(id=>{
        if(totals[id] < totals[winner]) winner = id;
        if(totals[id] > totals[loser]) loser = id;
      });
      g.winnerId = winner;
      g.loserId = loser;
    }
    ui.editingRound = null;
    saveState();
    render();
  }

      playState: null
    };
    state.games.push(game);
    state.activeGameId = game.id;
    ui.screen = "activeGame";
    startNewPlayRound(game);
    render();
  }

  function togglePassCardSelection(cardId){
    const idx = ui.playSelectedCards.indexOf(cardId);
    if(idx>-1){ ui.playSelectedCards.splice(idx,1); }
    else{
      if(ui.playSelectedCards.length>=2) return;
      ui.playSelectedCards.push(cardId);
    }
    render();
  }

  function confirmPass(){
    const g = activeGame();
    if(!g || !g.playState) return;
    const ps = g.playState;
    const currentHumanId = ps.passQueueHumans[0];
    if(!currentHumanId || ui.playSelectedCards.length!==2) return;
    ps.passSelections[currentHumanId] = [...ui.playSelectedCards];
    ps.passQueueHumans.shift();
    ui.playSelectedCards = [];
    ui.playRevealedSeatId = null;
    saveState();
    if(ps.passQueueHumans.length===0){
      executePass(g);
    }
    render();
  }

  function playHumanCard(cardId){
    const g = activeGame();
    if(!g || !g.playState) return;
    const ps = g.playState;
    const actingId = getActingSeatId(g);
    const hand = ps.hands[actingId];
    const card = hand.find(c=>c.id===cardId);
    if(!card) return;
    const legal = getLegalCards(hand, ps.currentTrick);
    if(!legal.some(c=>c.id===cardId)){ showToast("Ezt a lapot most nem játszhatod ki."); return; }
    playCard(g, actingId, card);
    ui.playRevealedSeatId = null;
    if(g.playState && g.playState.phase==="playing"){
      processAiTurns(g);
    }
    render();
  }

  function continueTrick(){
    const g = activeGame();
    if(!g || !g.playState || g.playState.phase!=="trickResult") return;
    const ps = g.playState;
    const lt = ps.lastTrick;
    if(lt.trickNumber===8){
      let moonShooter = null;
      const scores = {};
      const moonSeat = g.seating.find(id=> (ps.trickWinsCount && ps.trickWinsCount[id]) === 8);
      if(moonSeat){
        moonShooter = moonSeat;
        g.seating.forEach(id=>{ scores[id] = (id===moonSeat) ? 0 : 19; });
      } else {
        g.seating.forEach(id=>{ scores[id] = ps.collectedPoints[id] || 0; });
      }
      commitRound(g, scores, moonShooter);
    } else {
      ps.trickLeaderSeatId = lt.winnerId;
      ps.trickIndex += 1;
      ps.currentTrick = [];
      ps.lastTrick = null;
      ps.phase = "playing";
      saveState();
      processAiTurns(g);
    }
    ui.playRevealedSeatId = null;
    render();
  }

  function startGame(){
    if(ui.selectedSeating.length!==4) return;
    const game = {
      id: uid(),
      createdAt: Date.now(),
      targetScore: ui.targetScore || 100,
      seating: [...ui.selectedSeating],
      sessionId: state.activeSessionId || null,
      rounds: [],
      finished: false,
      finishedAt: null,
      winnerId: null
    };
    state.games.push(game);
    state.activeGameId = game.id;
    ui.roundInputs = {};
    ui.moonMode = false;
    ui.moonPlayer = null;
    ui.screen = "activeGame";
    saveState();
    render();
  }

  function saveRound(){
    const g = activeGame();
    if(!g) return;
    let scores = {};
    let moonShooter = null;

    if(ui.moonMode){
      if(!ui.moonPlayer){ showToast("Válaszd ki, ki vitte el az összes ütést."); return; }
      moonShooter = ui.moonPlayer;
      g.seating.forEach(id=>{ scores[id] = (id===moonShooter) ? 0 : 19; });
    } else {
      g.seating.forEach(id=>{
        const v = ui.roundInputs[id];
        scores[id] = (v===undefined||v==="") ? 0 : Math.max(0, Number(v));
      });
    }

    const sum = Object.values(scores).reduce((a,b)=>a+b,0);
    if(!moonShooter && sum>19){
      ui.modal = {
        type: "roundOverMax",
        title: "19 pontnál több",
        body: `A beírt pontok összege ${sum}, egy teljes kör viszont legfeljebb 19 pontot ér. Biztosan ezt szeretnéd rögzíteni?`,
        confirmLabel: "Mentés mégis",
        cancelLabel: "Vissza szerkeszteni",
        pendingScores: scores,
        pendingMoonShooter: moonShooter
      };
      render();
      return;
    }

    ui.roundInputs = {};
    ui.moonMode = false;
    ui.moonPlayer = null;
    commitRound(g, scores, moonShooter);
    render();
  }

  function confirmEndGame(){
    ui.modal = {
      type: "manualEnd",
      title: "Játék lezárása",
      body: "Biztosan lezárod a jelenlegi játékot? A végeredmény bekerül az előzményekbe.",
      confirmLabel: "Lezárás",
      cancelLabel: "Mégse"
    };
    render();
  }

  function handleModalCancel(){
    const wasPlayContinue = ui.modal && ui.modal.type==="gameEndSuggest";
    ui.modal = null;
    if(wasPlayContinue){
      const g = activeGame();
      if(g && g.mode==="play" && !g.playState) startNewPlayRound(g);
    }
    render();
  }

  function handleModalConfirm(){
    const m = ui.modal;
    ui.modal = null;
    if(m && (m.type==="gameEndSuggest" || m.type==="manualEnd")){
      finishActiveGame();
    } else if(m && m.type==="resetStats"){
      state.games = [];
      state.activeGameId = null;
      saveState();
      render();
    } else if(m && m.type==="closeSession"){
      const s = state.sessions.find(s=>s.id===m.sessionId);
      if(s){ s.closed = true; s.closedAt = Date.now(); if(state.activeSessionId===s.id) state.activeSessionId = null; saveState(); }
      render();
    } else if(m && m.type==="deleteSession"){
      state.sessions = state.sessions.filter(s=>s.id!==m.sessionId);
      if(state.activeSessionId===m.sessionId) state.activeSessionId = null;
      saveState();
      ui.screen = "sessions";
      render();
    } else if(m && m.type==="roundOverMax"){
      const g = activeGame();
      if(g){
        ui.roundInputs = {};
        ui.moonMode = false;
        ui.moonPlayer = null;
        commitRound(g, m.pendingScores, m.pendingMoonShooter);
      }
      render();
    } else if(m && m.type==="editRound"){
      applyRoundEdit(m.gameId, m.roundIndex, m.pendingScores, m.pendingMoonShooter);
    }
  }

  function resetStatsPrompt(){
    ui.modal = {
      type: "resetStats",
      title: "Statisztikák nullázása",
      body: "Ez véglegesen törli az összes eddigi lezárt játék eredményét és a hozzá tartozó statisztikát. A játékosok és a munkamenetek megmaradnak. Ez nem vonható vissza.",
      confirmLabel: "Törlés",
      cancelLabel: "Mégse"
    };
    render();
  }

  function finishActiveGame(){
    const g = activeGame();
    if(!g) return;
    const totals = computeTotals(g);
    let winner = g.seating[0];
    let loser = g.seating[0];
    g.seating.forEach(id=>{
      if(totals[id] < totals[winner]) winner = id;
      if(totals[id] > totals[loser]) loser = id;
    });
    g.finished = true;
    g.finishedAt = Date.now();
    g.winnerId = winner;
    g.loserId = loser;
    state.activeGameId = null;
    saveState();
    ui.historyOpenId = g.id;
    ui.screen = "gameDetail";
    render();
  }

  loadState();
  resumeOnlineSession();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("Service worker regisztráció sikertelen", e); });
    });
  }
})();
</script>
</body>
</html>
